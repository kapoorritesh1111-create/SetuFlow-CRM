name: Verify mobile Mail reliability patch
on:
  push:
    branches: [fix/mobile-mail-reliability-20260912]
    paths: [scripts/apply-mobile-mail-reliability.py, .github/workflows/mobile-mail-reliability-fix.yml, src/app/api/mail/calendar-invite/route.ts]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Materialize patch
        run: python3 scripts/apply-mobile-mail-reliability.py
      - run: npm ci
      - name: Targeted regressions and types
        run: |
          node --test tests/mail/mobile-reliability-followup.test.mjs tests/mail/mobile-communication-notifications.test.mjs tests/mail/batch4-notifications.test.mjs
          npm run typecheck
      - name: Full production build gate
        run: npm run build
      - name: Commit verified patch and remove one-shot helpers
        run: |
          rm scripts/apply-mobile-mail-reliability.py .github/workflows/mobile-mail-reliability-fix.yml
          git diff --check
          git add src/ public/ tests/mail/mobile-reliability-followup.test.mjs scripts/apply-mobile-mail-reliability.py .github/workflows/mobile-mail-reliability-fix.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'S41-FIX-119: Fix mobile mail refresh, unread state, reader back and ICS invites'
          git push origin HEAD:fix/mobile-mail-reliability-20260912
