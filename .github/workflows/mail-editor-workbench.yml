name: Mail editor dependency workbench
on:
  push:
    branches: [mail/mvp-completion-20260911]
    paths: [.github/workflows/mail-editor-workbench.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --ignore-scripts --save-exact @tiptap/react @tiptap/pm @tiptap/starter-kit sanitize-html
      - run: npm install --ignore-scripts --save-dev --save-exact @types/sanitize-html esbuild
      - run: npm ls @tiptap/react @tiptap/pm @tiptap/starter-kit sanitize-html @types/sanitize-html esbuild
      - run: tar -czf mail-editor-dependencies.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: mail-editor-dependencies
          path: mail-editor-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
