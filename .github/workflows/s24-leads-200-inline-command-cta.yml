name: S24 Leads 200 Inline Command CTA Patch

on:
  push:
    paths:
      - '.github/workflows/s24-leads-200-inline-command-cta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch inline lead command center contact CTAs
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/features/leads/components/workspace/LeadsCommandCenter.tsx')
          s = p.read_text()
          if 'S24-LEADS-200 inline command contact CTAs' in s:
              print('Inline command CTA patch already present')
          else:
              needle = "  const canContinueQuote = Boolean(latestQuote || selectedProductNames.length || rfqs.length);\n"
              insert = """  const canContinueQuote = Boolean(latestQuote || selectedProductNames.length || rfqs.length);\n  const leadContact = lead as LeadRow & { email?: string | null; phone?: string | null; whatsapp_number?: string | null };\n  const emailAddress = leadContact.email?.trim() || '';\n  const phoneNumber = leadContact.phone?.trim() || '';\n  const whatsappSource = leadContact.whatsapp_number?.trim() || phoneNumber;\n  const telHref = phoneNumber ? `tel:${phoneNumber.replace(/[^+0-9]/g, '')}` : '';\n  const mailHref = emailAddress ? `mailto:${encodeURIComponent(emailAddress)}?subject=${encodeURIComponent(`SETU Flow follow-up: ${lead.company_name}`)}` : '';\n  const whatsappHref = whatsappSource ? `https://wa.me/${whatsappSource.replace(/[^0-9]/g, '')}` : '';\n"""
              if needle not in s:
                  raise SystemExit('Could not find CTA variable insertion point')
              s = s.replace(needle, insert, 1)

              anchor = """            {/* CTA buttons — spec .lhc-actions */}\n            <div className=\"flex flex-wrap items-center gap-2\">\n"""
              contact_block = """            {/* CTA buttons — spec .lhc-actions */}\n            <div className=\"flex flex-wrap items-center gap-2\">\n              {/* S24-LEADS-200 inline command contact CTAs */}\n              {emailAddress ? (\n                <a href={mailHref} onClick={(event) => event.stopPropagation()} title={`Email ${lead.company_name}`} aria-label={`Email ${lead.company_name}`} className=\"inline-flex h-10 w-10 items-center justify-center rounded-full border border-blue-200 bg-white text-blue-700 shadow-[0_8px_20px_rgba(15,23,42,.08)] transition hover:border-blue-300 hover:bg-blue-50\">\n                  <svg viewBox=\"0 0 24 24\" className=\"h-4 w-4\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\" /><path d=\"m4 7 8 6 8-6\" /></svg>\n                </a>\n              ) : null}\n              {whatsappHref ? (\n                <a href={whatsappHref} target=\"_blank\" rel=\"noreferrer\" onClick={(event) => event.stopPropagation()} title={`WhatsApp ${lead.company_name}`} aria-label={`WhatsApp ${lead.company_name}`} className=\"inline-flex h-10 w-10 items-center justify-center rounded-full border border-emerald-200 bg-white text-emerald-700 shadow-[0_8px_20px_rgba(15,23,42,.08)] transition hover:border-emerald-300 hover:bg-emerald-50\">\n                  <svg viewBox=\"0 0 32 32\" className=\"h-5 w-5\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"16\" r=\"14\" fill=\"#25D366\" /><path fill=\"#fff\" d=\"M23.1 18.8c-.4-.2-2.4-1.2-2.8-1.3-.4-.1-.7-.2-1 .2-.3.4-1.1 1.3-1.4 1.6-.3.3-.5.3-.9.1-.4-.2-1.7-.6-3.2-2-1.2-1.1-2-2.4-2.2-2.8-.2-.4 0-.6.2-.8.2-.2.4-.5.6-.7.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-1-2.4-1.3-3.2-.3-.8-.7-.7-1-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.5 1.5-1.5 3.6s1.6 4.2 1.8 4.5c.2.3 3.1 4.8 7.6 6.7 1.1.5 1.9.7 2.5.9 1.1.3 2 .3 2.8.2.9-.1 2.4-1 2.8-2 .3-1 .3-1.8.2-2-.1-.2-.4-.3-.8-.5Z\" /><path fill=\"#fff\" d=\"M8.2 26.5 9.4 22A10.9 10.9 0 1 1 13.9 24l-5.7 2.5Zm5.9-4.5.3.1a8.9 8.9 0 1 0-3.1-2.3l.2.3-.7 2.7 3.3-.8Z\" /></svg>\n                </a>\n              ) : null}\n              {phoneNumber ? (\n                <a href={telHref} onClick={(event) => event.stopPropagation()} title={`Call ${lead.company_name}`} aria-label={`Call ${lead.company_name}`} className=\"inline-flex h-10 w-10 items-center justify-center rounded-full border border-[#0b2e4a]/15 bg-white text-[#0b2e4a] shadow-[0_8px_20px_rgba(15,23,42,.08)] transition hover:border-[#0b2e4a]/30 hover:bg-slate-50\">\n                  <svg viewBox=\"0 0 24 24\" className=\"h-4 w-4\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\"><path d=\"M22 16.92v2a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.18 2 2 0 0 1 4.11 1h2a2 2 0 0 1 2 1.72c.13.96.35 1.9.66 2.8a2 2 0 0 1-.45 2.11L7.1 8.85a16 16 0 0 0 6 6l1.22-1.22a2 2 0 0 1 2.11-.45c.9.31 1.84.53 2.8.66A2 2 0 0 1 22 16.92Z\" /></svg>\n                </a>\n              ) : null}\n"""
              if anchor not in s:
                  raise SystemExit('Could not find CTA block insertion point')
              s = s.replace(anchor, contact_block, 1)
              p.write_text(s)
              print('Patched inline command center CTAs')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'setu-flow-bot'
          git config user.email 'setu-flow-bot@users.noreply.github.com'
          git add src/features/leads/components/workspace/LeadsCommandCenter.tsx
          git commit -m 'Add inline command center contact CTAs'
          git push
