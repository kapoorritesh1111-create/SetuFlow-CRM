name: S37 share catalog patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s37-final-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch share catalog mapping defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Product readiness: for buyer share, only missing price should block readiness.
          p = Path('src/lib/catalog-share/types.ts')
          s = p.read_text()
          s = s.replace("""  let status: ProductReadiness;
  if (!hasPrice) status = 'missing_price';
  else if (hardMissing.length > 0) status = 'needs_data';
  else status = 'ready';

  return { status, score, missing };""", """  let status: ProductReadiness;
  if (!hasPrice) status = 'missing_price';
  else status = 'ready';

  return { status, score, missing };""")
          s = s.replace("case 'needs_data': return 'Needs Data';", "case 'needs_data': return 'Curated';")
          p.write_text(s)

          # Share wizard: preselect products already mapped to the lead / category flow.
          w = Path('src/components/catalog/share-catalog-wizard.tsx')
          s = w.read_text()
          s = s.replace("""type LeadLite = {
  id: string; company_name: string | null; contact_name: string | null; email: string | null;
  phone: string | null; whatsapp_number: string | null; trade_show_name: string | null;
  trade_event_id: string | null; products_or_needs: string | null; main_product_category: string | null; market_id: string | null;
};""", """type LeadLite = {
  id: string; company_name: string | null; contact_name: string | null; email: string | null;
  phone: string | null; whatsapp_number: string | null; trade_show_name: string | null;
  trade_event_id: string | null; products_or_needs: string | null; main_product_category: string | null; market_id: string | null;
  product_ids?: string[];
};""")
          s = s.replace("""  function applyLead(l: Partial<LeadLite>) {
    setSelectedLead(l as LeadLite);
    setBuyer({ buyer_company: l.company_name ?? '', buyer_name: l.contact_name ?? '', buyer_email: l.email ?? '', buyer_phone: l.whatsapp_number ?? l.phone ?? '' });
  }""", """  function applyLead(l: Partial<LeadLite>) {
    setSelectedLead(l as LeadLite);
    setBuyer({ buyer_company: l.company_name ?? '', buyer_name: l.contact_name ?? '', buyer_email: l.email ?? '', buyer_phone: l.whatsapp_number ?? l.phone ?? '' });
    const mappedProductIds = Array.isArray(l.product_ids) ? l.product_ids.filter(Boolean) : [];
    if (mappedProductIds.length) setPicked(new Set(mappedProductIds));
  }""")
          s = s.replace("""                        if (p.fob_price == null && p.exw_price == null && p.cif_price == null && !priceListId) noPrice += 1;""", """                        if (p.fob_price == null && p.exw_price == null && p.cif_price == null && !priceListId) noPrice += 1;""")
          w.write_text(s)

          # Lead share page: pass the products already mapped on the lead into the drawer.
          sp = Path('src/features/leads/share-price-list/SharePriceListPremium.tsx')
          s = sp.read_text()
          s = s.replace("""  const leadPrefill = { id: lead.id, company_name: lead.company_name, contact_name: lead.contact_name, email: lead.email, phone: lead.phone, whatsapp_number: lead.whatsapp_number };""", """  const leadPrefill = { id: lead.id, company_name: lead.company_name, contact_name: lead.contact_name, email: lead.email, phone: lead.phone, whatsapp_number: lead.whatsapp_number, product_ids: products.map((product) => product.id) };""")
          sp.write_text(s)

          # Leave this temporary workflow disabled after it patches the repo.
          Path('.github/workflows/s37-final-cleanup.yml').write_text("name: S37 final cleanup disabled\non: workflow_dispatch\njobs:\n  noop:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo disabled\n")
          PY
      - name: Commit share catalog patch
        run: |
          git config user.name "setu-flow-cleanup-bot"
          git config user.email "actions@github.com"
          git add src/lib/catalog-share/types.ts src/components/catalog/share-catalog-wizard.tsx src/features/leads/share-price-list/SharePriceListPremium.tsx .github/workflows/s37-final-cleanup.yml
          git commit -m "S37-SHARE: Preselect mapped products in share catalog"
          git push
