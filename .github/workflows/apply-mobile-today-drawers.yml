name: Materialize reviewed mobile patch on isolated branch
on:
  push:
    branches: [fix/mobile-today-drawers-20260912]
    paths: [scripts/apply-mobile-today-drawers.py]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-today-drawers-20260912
      - name: Apply exact-source patch
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 scripts/apply-mobile-today-drawers.py
          git diff --check
          git add src/
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'S41-FIX-117: Apply safe-area drawers and today-only notification feed'
          git push origin HEAD:fix/mobile-today-drawers-20260912
