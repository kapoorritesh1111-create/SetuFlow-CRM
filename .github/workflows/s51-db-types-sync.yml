name: S51 DB Types Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/s51-db-types-sync.yml'

permissions:
  contents: write

jobs:
  sync-types:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate current production database types
        run: supabase gen types typescript --project-id sjzfzloggabsmcuxktnl > src/types/database.generated.ts
      - name: Push generated types to a one-shot branch
        shell: bash
        run: |
          if git diff --quiet -- src/types/database.generated.ts; then
            echo "Generated types already match production."
            exit 0
          fi
          branch="chore/s51-db-types-sync-${GITHUB_RUN_ID}"
          git config user.name "setu-flow-db-types-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/types/database.generated.ts
          git commit -m "chore(db): sync generated types after S51 rollout"
          git push origin "$branch"
