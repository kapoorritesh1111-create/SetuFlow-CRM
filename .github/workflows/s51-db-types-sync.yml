name: S51 DB Types Sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-types:
    if: startsWith(github.head_ref, 'chore/s51-db-types-finalize')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate current production database types
        run: supabase gen types typescript --project-id sjzfzloggabsmcuxktnl > src/types/database.generated.ts
      - name: Commit generated types to the PR branch
        shell: bash
        run: |
          if git diff --quiet -- src/types/database.generated.ts; then
            echo "Generated types already match production."
            exit 0
          fi
          git config user.name "setu-flow-db-types-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/types/database.generated.ts
          git commit -m "chore(db): sync generated types after S51 rollout"
          git push origin HEAD:${GITHUB_HEAD_REF}
