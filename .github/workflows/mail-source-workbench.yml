name: Mail source regression workbench
on:
  push:
    branches: [mail/mvp-completion-20260911]
    paths: [.github/workflows/mail-source-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > mail-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mail-source-workbench
          path: mail-source.tar.gz
          retention-days: 1
          compression-level: 0
