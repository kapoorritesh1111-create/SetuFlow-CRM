name: Check DB Type Drift

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  type-sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check Supabase access token
        id: token-check
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN repository secret is not configured. Skipping live type-drift check."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate fresh database types
        if: steps.token-check.outputs.missing == 'false'
        run: supabase gen types typescript --project-id sjzfzloggabsmcuxktnl > /tmp/database.generated.fresh.ts
      - name: Compare committed generated types
        if: steps.token-check.outputs.missing == 'false'
        run: |
          if diff -u src/types/database.generated.ts /tmp/database.generated.fresh.ts; then
            echo "Types in sync"
          else
            echo "TYPE DRIFT DETECTED"
            echo "Run: npm run db:types"
            echo "Then commit src/types/database.generated.ts."
            exit 1
          fi
