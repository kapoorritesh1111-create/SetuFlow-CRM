name: LinkedIn Daily Growth

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: read

jobs:
  linkedin-daily:
    name: Publish SETU Flow LinkedIn post
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish or generate LinkedIn draft
        run: node scripts/linkedin-daily.mjs
        env:
          SETU_MARKETING_SITE_URL: https://www.setuflowcrm.com
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202604' }}

      - name: Upload LinkedIn run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-daily-report
          path: docs/growth/linkedin-daily.json
          if-no-files-found: warn
