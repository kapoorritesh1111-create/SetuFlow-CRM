name: One-off Sprint 18 docs patch

on:
  push:
    paths:
      - '.github/workflows/s18-docs-patch.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only section s18 and sidebar label
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('public/internal/setuflow-docs.html')
          text = path.read_text(encoding='utf-8')

          old_label = '<a href="#s18"><span class="num">18</span> Sprint 17 Changes</a>'
          new_label = '<a href="#s18"><span class="num">18</span> Sprint 18 Plan / Status</a>'
          if old_label not in text:
              raise SystemExit('Expected sidebar Sprint 17 label not found')
          text = text.replace(old_label, new_label, 1)

          start_marker = '<!-- ═══ S18: SPRINT 17 ═══ -->'
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Expected S18 start marker not found')
          end_marker = '\n</section>'
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Expected S18 closing section not found')
          end += len(end_marker)

          new_section = '''<!-- ═══ S18: SPRINT 18 ═══ -->
<section class="section" id="s18">
<div class="section-header"><div class="section-num">18</div><h1>Sprint 18 — Integration-Ready Plan / Status</h1></div>

<div class="alert alert-blue"><strong>Sprint 18 status:</strong> integration-ready foundations are being moved into production truthfully. Mailtrap is production-ready and working. Finance, freight, banking, and WhatsApp Business API are not live external integrations yet.</div>

<style>
.s18-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:16px}
.s18-card h3{margin-top:0;color:#0f2244}
.s18-status{display:inline-block;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.s18-live{background:#d1fae5;color:#065f46}
.s18-ready{background:#dbeafe;color:#1d4ed8}
.s18-pending{background:#fef3c7;color:#92400e}
.s18-manual{background:#f1f5f9;color:#475569}
.s18-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:16px 0}
.s18-files{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:11px;font-family:monospace;color:#334155;margin-top:10px}
.s18-note{font-size:12px;color:#64748b;margin-top:8px}
.s18-list{padding-left:18px;margin-top:8px}
.s18-list li{font-size:12.5px;color:#64748b;margin-bottom:4px}
</style>

<h2>Approved Product Decisions</h2>
<div class="s18-grid">
  <div class="s18-card" style="border-left:4px solid #10b981">
    <span class="s18-status s18-live">Production-ready</span>
    <h3>Mailtrap email</h3>
    <p>Mailtrap is the approved production email integration for now. It is tested, confirmed working, and remains the truthful live provider for invitations and order-document sends.</p>
  </div>
  <div class="s18-card" style="border-left:4px solid #3b82f6">
    <span class="s18-status s18-ready">Approved UX</span>
    <h3>Analytics shell</h3>
    <p>The approved Analytics UX direction is locked. The current dashboard analytics shell has been updated with shared filters, KPI cards, funnel, trend, top markets/products, and insights/anomalies while avoiding overclaiming unavailable historical dimensions.</p>
  </div>
  <div class="s18-card" style="border-left:4px solid #3b82f6">
    <span class="s18-status s18-ready">Approved direction</span>
    <h3>Orders Execution Cockpit</h3>
    <p>Orders UX direction is approved as an Execution Cockpit, not a Quote clone. Full redesign should wait for the complete CTA matrix, but Sprint 18 continues to improve execution truth, document preview, and send reliability.</p>
  </div>
</div>

<h2>Integration Truth Map</h2>
<div class="tbl-wrap">
<table>
<thead><tr><th>Area</th><th>Sprint 18 truth</th><th>Operator language</th><th>Do not claim</th></tr></thead>
<tbody>
<tr><td>Email</td><td><span class="badge badge-green">Live</span> Mailtrap active and working</td><td>Mailtrap production-ready</td><td>Multiple email providers live</td></tr>
<tr><td>Finance</td><td><span class="badge badge-blue">Queue-ready</span> <code>finance_integration_events</code> with <code>adapter_name='pending'</code></td><td>Queue invoice sync, View queue, Copy payload, Retry queued event</td><td>Xero / QuickBooks / Tally live sync</td></tr>
<tr><td>Freight</td><td><span class="badge badge-blue">Queue-ready</span> pending adapters only</td><td>Queue freight request, View queue, Copy payload</td><td>Live carrier booking or freight marketplace integration</td></tr>
<tr><td>Banks / Payments</td><td><span class="badge badge-slate">Manual / planned</span></td><td>Record payment reference, Confirm reconciliation</td><td>Bank feed or payment processor connected</td></tr>
<tr><td>WhatsApp</td><td><span class="badge badge-amber">Manual tracked links</span> wa.me / WhatsApp Web prefilled text</td><td>Open WhatsApp, operator reviews and sends manually</td><td>WhatsApp Business API live delivery</td></tr>
<tr><td>PDF</td><td><span class="badge badge-green">Free OSS path</span> <code>puppeteer-core</code> + <code>@sparticuz/chromium</code></td><td>Generate PDF, Download signed URL, Browser print fallback</td><td>Paid PDF API dependency</td></tr>
<tr><td>Open API / Webhooks</td><td><span class="badge badge-slate">Planned</span></td><td>Future partner contract</td><td>Public partner API available today</td></tr>
</tbody>
</table>
</div>

<h2>Current Sprint 18 Implementation Status</h2>
<div class="s18-grid">
  <div class="s18-card" style="border-left:4px solid #10b981">
    <span class="s18-status s18-live">Fixed</span>
    <h3>WhatsApp placeholder bug</h3>
    <ul class="s18-list">
      <li>Orders no longer open WhatsApp with “Secure link will follow.”</li>
      <li>Orders now create/reuse a tracked order-document preview URL.</li>
      <li>Prefilled WhatsApp text includes <code>View secure document: https://www.setuflowcrm.com/order-documents/preview/...</code>.</li>
      <li>Operator still manually reviews and sends in WhatsApp / WhatsApp Web.</li>
    </ul>
    <div class="s18-files">src/features/orders/server/order-whatsapp-delivery.ts<br>src/features/orders/components/OrdersProductionWorkspace81DRepair3.tsx</div>
  </div>
  <div class="s18-card" style="border-left:4px solid #10b981">
    <span class="s18-status s18-live">Polished</span>
    <h3>Order document preview</h3>
    <ul class="s18-list">
      <li>Order preview now follows the cleaner quote-style PDF direction.</li>
      <li>Includes branded header, party grid, summary, line items, totals, signatures, and compact terms.</li>
      <li>Browser print fallback remains intact.</li>
      <li>Server PDF path remains free/open-source.</li>
    </ul>
    <div class="s18-files">src/app/order-documents/preview/[token]/page.tsx<br>src/app/api/order-documents/pdf/route.ts</div>
  </div>
  <div class="s18-card" style="border-left:4px solid #10b981">
    <span class="s18-status s18-live">Updated shell</span>
    <h3>Analytics dashboard</h3>
    <ul class="s18-list">
      <li>Approved Analytics UX proposal is locked for later deeper implementation.</li>
      <li>Current shell now matches the approved layout direction: filters, KPIs, funnel, trend, top segments, and insights.</li>
      <li>Copy remains honest where trend/filter dimensions are not yet fully historical.</li>
    </ul>
    <div class="s18-files">src/app/(app)/dashboard/analytics/page.tsx</div>
  </div>
  <div class="s18-card" style="border-left:4px solid #3b82f6">
    <span class="s18-status s18-ready">Admin direction</span>
    <h3>Admin Integrations page</h3>
    <ul class="s18-list">
      <li><code>/admin/integrations</code> presents live, queue-ready, manual, and planned integration states.</li>
      <li>Investor-friendly but explicit: Mailtrap live; Finance/Freight queue-ready only; WhatsApp manual; PDF free renderer.</li>
      <li>Open API/Webhooks remain planned.</li>
    </ul>
    <div class="s18-files">src/app/(app)/admin/integrations/page.tsx<br>src/lib/routes/manifest.json<br>src/components/shell/route-meta.ts</div>
  </div>
</div>

<h2>Database / Storage Status</h2>
<div class="card-grid">
  <div class="card" style="border-left:4px solid #10b981">
    <div class="card-title">✅ PDF storage path</div>
    <ul>
      <li><code>order_documents.pdf_storage_path</code> added if missing.</li>
      <li>Used for Supabase Storage object paths.</li>
      <li>Signed download URL returned by server route.</li>
    </ul>
  </div>
  <div class="card" style="border-left:4px solid #10b981">
    <div class="card-title">✅ Private PDF bucket</div>
    <ul>
      <li>Bucket: <code>order-documents</code>.</li>
      <li>Private storage; PDFs are shared through signed URLs.</li>
      <li>Allowed MIME intent: <code>application/pdf</code>.</li>
    </ul>
  </div>
  <div class="card" style="border-left:4px solid #f59e0b">
    <div class="card-title">⟳ Finance / Freight adapters</div>
    <ul>
      <li>Queue tables exist for integration-ready events.</li>
      <li>Adapters remain pending.</li>
      <li>No external provider is connected yet.</li>
    </ul>
  </div>
</div>

<h2>Leadership Notes</h2>
<div class="alert alert-amber"><strong>Do not overclaim:</strong> Sprint 18 positions SetuFlow as integration-ready, not fully externally integrated. Mailtrap is live. Finance, freight, banks/payments, WhatsApp Business API, and public Open API/Webhooks remain staged, manual, or planned.</div>
<div class="alert alert-green"><strong>Current live progress:</strong> WhatsApp placeholder bug fixed, order preview polished, analytics shell updated, Admin Integrations page added, PDF route builds on Vercel, and Vercel is green.</div>

</section>'''

          patched = text[:start] + new_section + text[end:]
          path.write_text(patched, encoding='utf-8')

          workflow = Path('.github/workflows/s18-docs-patch.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit docs patch
        run: |
          git config user.name "setuflow-docs-bot"
          git config user.email "setuflow-docs-bot@users.noreply.github.com"
          git status --short
          git add public/internal/setuflow-docs.html .github/workflows/s18-docs-patch.yml
          git commit -m "docs(s18): update sprint 18 plan status section"
          git push
