## 12. CONTACT EXCHANGE (SMART vCARD) — COMPLETE GUIDE

### What is Contact Exchange?
A digital business card system that lets SetuFlow users share their contact details via QR code, link, or .vcf file.

### My Card Settings (`/profile` or `/contact-exchange/vcard`)
Users configure:
- Name, title, company, phone, email, website, address
- Profile photo (compressed for iOS compatibility)
- Share slug (custom URL)
- Smart QR vs Offline QR toggle

### Smart QR vs Offline QR
| Mode | What it does |
|---|---|
| **Smart QR** | Scans opens the public card page — supports analytics, looks professional |
| **Offline QR** | Scans downloads the .vcf file directly — works without internet |

### Share Actions
1. **Save Contact** — downloads .vcf file
2. **Copy Link** — copies public card URL
3. **Share Card** — native share sheet
4. **Send Email** — email the contact card
5. **Apple Wallet / Google Wallet** — premium pass placeholders (future)

### Public Card
Accessible without login at the saved share URL. Includes Open Graph metadata for social previews.

