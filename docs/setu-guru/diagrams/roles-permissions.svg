## 7. QUOTES — COMPLETE GUIDE

### Quote Statuses (in order)
```
draft → internal_review → pending_approval → approved → sent → accepted / rejected / expired
```

Also: `revised` (when a new version is created after feedback)

### Quote Fields
- Lead/buyer reference
- Incoterm (EXW, FOB, CIF, DDP, etc.)
- Currency
- Payment terms
- Line items: product, variant, quantity, unit price, pack size, MOQ, pricing basis
- Quote-only adjustments (discounts/markups)
- FX reference (source currency, quote currency, rate, valid until)
- Approval status
- PDF generation

### Quote-Only Adjustments
- Operators can apply **discount** or **markup** at quote level (% or flat amount)
- Adjustments beyond **15%** require owner/admin approval
- These adjustments do NOT change product/catalog pricing — they are quote-specific only

### Quote Approval Flow
1. Sales creates quote → status: `draft`
2. If adjustment > 15%, system flags `pending_approval`
3. Owner/Admin sees approval queue in Quotes workspace
4. Approve → status: `approved`
5. Reject → status back to `draft` with rejection reason required
6. Send to customer → status: `sent`
7. Customer accepts → status: `accepted`
8. Accepted quote → **Create Order** handoff

### Sending a Quote
From the Quotes workspace modal:
- **Send by Email** → routes through `/approval-send`
- **Send by WhatsApp** → WhatsApp delivery workflow
- **PDF Preview** → generates and opens customer-facing PDF

### Quote PDF Layout
The customer-facing PDF includes:
- Branded header with organization logo
- Bill-to / status cards
- Line item table: SKU, product, pack, units/case, MOQ, basis, unit price, case price
- Category grouping with subtotals (when multiple categories)
- Quote-only discount/markup visibility with original prices
- Quote total
- Terms and conditions footer

