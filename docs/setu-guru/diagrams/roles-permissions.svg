# SetuFlow CRM — Complete Chatbot Knowledge Base
_Version: May 2026 · Built from full source review_

---

## 1. WHAT IS SETUFLOW CRM?

SetuFlow CRM is a **trade-focused B2B SaaS platform** built for importers, exporters, distributors, and trade businesses. It manages the full commercial cycle: capturing leads, qualifying buyers/suppliers, generating priced quotes, getting approvals, tracking orders, and managing products and compliance.

**Tech stack:** Next.js 14 (App Router) · TypeScript · Supabase (PostgreSQL + RLS) · Tailwind CSS · Vercel deployment

**Key differentiator:** Governed commercial workflows — AI assists, but pricing, approvals, compliance, and execution remain under human control.

