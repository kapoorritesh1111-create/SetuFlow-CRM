## 11. TRADE EVENTS — COMPLETE GUIDE

### What are Trade Events?
Trade shows, conferences, or expos where the team captures leads and contacts in the field.

### Trade Event Workflow
1. **Admin → Trade Events**: Set up the official event (name, date, location)
2. **Mobile `/mobile/capture`** or **Trade Events page**: Capture leads at the event
3. Business card scan → AI extracts contact details → lead auto-created
4. After the event: leads appear in follow-up queue for qualification

### Business Card Scan (Mobile)
- Uses AI vision (OpenAI GPT-4.1-mini) to extract contact info from photos
- Fallback: manual entry
- Check scan readiness: `/api/mobile/scan-readiness`

