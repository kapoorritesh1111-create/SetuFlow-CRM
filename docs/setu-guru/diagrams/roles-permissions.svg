## 22. SECURITY ARCHITECTURE

### Multi-tenant Isolation
- Every organization has a unique `organization_id`
- All operational tables have `organization_id` column
- Row Level Security (RLS) enforces: users only see their own org's data
- Key RLS functions: `is_org_member(org_id)`, `is_org_admin(org_id)`

### Authentication
- Supabase Auth (email + password)
- Invitation-only workspace access
- Invitation tokens expire
- First admin sets password on invitation acceptance

### Admin-Only Routes
- `/admin/client-onboarding` — hidden from client workspaces
- Guarded by Setu platform organization check

