## 8. PRICING ENGINE — COMPLETE GUIDE

### Pricing Hierarchy (6 levels)
```
EXW → FOB → CIF → DDP → Distributor Price → Retail Price
```

| Level | Meaning |
|---|---|
| **EXW** | Ex-Works — price at factory gate, buyer handles all logistics |
| **FOB** | Free on Board — price at port of origin, seller handles export |
| **CIF** | Cost + Insurance + Freight — price delivered to destination port |
| **DDP** | Delivered Duty Paid — full landed cost at buyer's door |
| **Distributor** | DDP + internal margin applied for distributor channel |
| **Retail** | Distributor price + retail margin |

### Cost Layers (EXW → FOB → CIF → DDP)
- EXW + Inland transport + Export customs + Port handling = **FOB**
- FOB + Freight + Insurance = **CIF**
- CIF + Import duty % + Destination charges + Local delivery = **DDP**
- DDP + Internal margin = **Internal/Operator price**
- Internal + Distributor margin = **Distributor price**
- Distributor + Retail margin = **Retail price**

### Margin Modes
- **Markup**: Price = Base × (1 + margin%)
- **Margin**: Price = Base ÷ (1 − margin%)

### Pricing Rules Hierarchy (where prices come from)
1. **Quote-level adjustment** (highest priority — overrides only for that quote)
2. **Product variant pricing rule**
3. **Product-level pricing rule**
4. **Category-level default rules** (set in Admin → Categories)
5. **Organization-level default rules** (set in Admin → Organization)

### Pricing Calculator
Available in Products workspace and product detail. Operators enter:
- Starting level and price
- Cost layer amounts
- Margin mode and percentages

System calculates all other levels automatically.

