## 10. PRODUCTS & CATALOG — COMPLETE GUIDE

### Product Structure
```
Product Category
  └── Product
        └── Product Variant (SKU)
              └── Pricing Rules
```

### Product Fields
- Name, SKU, description
- Category
- Status (active/inactive)
- Trade attributes (HS code, origin country)
- Variants: pack size, units per case, MOQ, pricing basis, UOM

### Catalog Import/Export
From Products workspace → Catalog Command Center:
- **Download CSV template** for products, categories, or pricing
- **Upload CSV** with validation preview
- **Review errors** before committing
- Imports write product setup and starting prices; shared costs/margins stay in pricing defaults

### Admin → Product Management (Governance)
This is a governance view, NOT a day-to-day editing surface. Shows:
- Catalog readiness score
- Products with pricing gaps
- Products without variants
- Trade attribute coverage
- Import/audit exceptions

For day-to-day product editing → use `/products`

### Admin → Categories (Taxonomy)
- Create/edit product categories
- Set category hierarchy (parent categories)
- Set category-level pricing defaults
- View category health metrics

