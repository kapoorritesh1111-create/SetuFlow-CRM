## 23. COMMON USER QUESTIONS & ANSWERS

**Q: How do I add a new team member?**
A: Go to Admin → Invitations (`/admin/invitations`). Enter their email, select their role, and click Send Invitation. They'll receive an email with a login link.

**Q: How do I create a quote for a lead?**
A: Open the lead → click "Create Quote" → complete the Terms step (incoterm, currency) → add products in the Pricing step → Save. The quote goes to Draft status.

**Q: Why is my quote stuck in "Pending Approval"?**
A: The quote has an adjustment (discount or markup) greater than 15%. An owner or admin needs to approve it in the Quotes workspace. They can find it in the approval queue.

**Q: How do I move an order forward?**
A: Go to Orders → open the order → check the blockers list. Resolve each blocker (sign contract, clear compliance items, upload required documents). When all blockers are cleared, the "Advance State" button becomes active.

**Q: How do I set up my digital business card?**
A: Go to Profile → My Card Settings (or `/contact-exchange/vcard`). Fill in your contact details, upload a photo, and save. Your QR code is immediately available to share.

**Q: How do I import products?**
A: Go to Products → Catalog Command Center → Download CSV template → Fill in your data → Upload → Review errors → Confirm import.

**Q: What's the difference between Markup and Margin in the pricing calculator?**
A: Markup adds a percentage ON TOP of the base (e.g., 20% markup on $100 = $120). Margin means the margin IS a percentage OF the final price (e.g., 20% margin on $100 base = $125, because $25/$125 = 20%).

**Q: How do I set up a new client organization?**
A: The client fills in the public form at `/onboarding`. Setu admins receive a notification, review the request at `/admin/client-onboarding`, run the provisioning wizard, and send the first admin invitation.

**Q: Where do I see AI-drafted suggestions?**
A: Go to `/ai-suggestions`. All AI drafts appear there for review before use. AI suggestions can also appear in lead detail pages as quick-draft options.

**Q: Can AI approve quotes or send them automatically?**
A: No. AI can draft messages and suggest actions, but pricing, approvals, and sending are always controlled by humans. This is by design.

**Q: How do I filter leads to just my market?**
A: Use the filter panel on the Leads page. Filter by Market to see only leads in your focus geography.

**Q: What does "Blocked" mean for a lead in the TodayBar?**
A: The lead has an open compliance or document blocker that prevents the order from advancing. Click the lead to see the specific blocker and resolve it.

