## 13. AI FEATURES — COMPLETE GUIDE

### AI Position
SetuFlow AI is **assistive, not autonomous**. AI helps draft and summarize; humans approve and execute.

### What AI Can Do
- Draft follow-up messages for leads
- Draft introduction messages
- Draft quote cover notes
- Suggest compliance next steps
- Summarize lead context
- Explain the next safe action from workflow blockers

### What AI Cannot Do
- Set catalog prices
- Approve quote overrides
- Bypass approval thresholds
- Clear compliance blockers
- Advance workflow state automatically
- Send final commercial terms
- Dispatch or complete orders

### AI Suggestions Workflow
1. AI draft appears in `/ai-suggestions` for review
2. Operator reviews, edits if needed
3. Operator approves → suggestion becomes a communication or action
4. AI provider: Anthropic Claude (primary), with safe fallback when disabled

### AI Analytics (`/admin/ai-analytics`)
Tracks AI usage metrics across the organization.

