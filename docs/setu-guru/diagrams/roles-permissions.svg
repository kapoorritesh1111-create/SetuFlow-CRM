## 5. LEAD LIFECYCLE — COMPLETE GUIDE

### What is a Lead?
A Lead is a buyer or supplier contact/company being managed through the CRM. Leads progress through pipeline stages.

### Lead Fields (Key)
- Company name, contact name, email, phone, WhatsApp
- Market(s), country, lead type (buyer/supplier)
- Pipeline stage
- Qualification status: `not_started` → `in_review` → `qualified` → `disqualified`
- Product mapping status: `pending` → `in_progress` → `ready`
- Deal value, currency
- Owner (assigned user)
- Next action, next action date
- Follow-up queue flags

### Lead Qualification Flow
1. **Not Started** — lead captured, not yet reviewed
2. **In Review** — qualification in progress, notes being added
3. **Qualified** — confirmed buyer/supplier match, ready for commercial action
4. **Disqualified** — not a good fit (archived, not deleted)

### Lead Follow-Up System (TodayBar)
The TodayBar shows urgent lead signals filterable by:
- **All Open** — everything active
- **Overdue** — past next-action date
- **Due Today** — due today
- **Waiting** — waiting for response
- **Blocked** — blocked by compliance/document issue
- **High Value** — deal value above threshold
- **Needs Reply** — requires operator action

### Creating a Lead
- Desktop: Click "+ New Lead" or "Quick Lead" from the Leads page header
- Mobile: Use `/mobile/capture` for fast entry
- Trade Event: Use trade-event capture during a show

### Lead → Quote Flow (Most Important Workflow)
1. Open the lead detail page
2. Click **"Create Quote"** in the lead workspace
3. The inline Quote Builder opens — **do not leave this page**
4. Step 1: **Terms** — set incoterm, currency, payment terms
5. Step 2: **Pricing** — add line items (products, quantities, prices)
6. Step 3: **Review** — check totals, add adjustments if needed
7. Save quote → it appears in the Quotes workspace and in the lead's quote history

