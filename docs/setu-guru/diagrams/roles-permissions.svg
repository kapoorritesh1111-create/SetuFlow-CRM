## 3. ROLES & PERMISSIONS

SetuFlow uses role-based access. Every user has one or more roles within their organization.

### Role Hierarchy (highest → lowest)
```
owner → admin → manager → sales → operations → sourcing → procurement → contributor → viewer
```

### What Each Role Can Do

| Role | Key Capabilities |
|---|---|
| **Owner** | Everything. Full workspace control. Only role that can manage billing/workspace-level settings. |
| **Admin** | Everything except ownership transfer. Creates users, invitations, markets, pipelines, categories. |
| **Manager** | Manages catalog, settings, leads, quotes. Can approve quotes. |
| **Sales** | Manages leads, creates and sends quotes. Cannot change catalog/settings. |
| **Operations** | Manages leads, reviews compliance and documents. Cannot send quotes. |
| **Sourcing** | Manages leads (sourcing focus). |
| **Procurement** | Manages leads (procurement focus). |
| **Contributor** | Creates/edits leads. Cannot send quotes or change settings. |
| **Viewer** | Read-only. Can view reports and most pages. Cannot create or edit. |

### Capability Reference
| Capability | Allowed Roles |
|---|---|
| `catalog.manage` | owner, admin, manager |
| `settings.manage` | owner, admin, manager |
| `lead.manage` | owner, admin, manager, sales, operations, sourcing, procurement, contributor |
| `quote.send` | owner, admin, manager, sales |
| `compliance.review` | owner, admin, manager, operations |
| `reporting.view` | owner, admin, manager, sales, operations, contributor, viewer |

