## 25. WHAT'S NEW (V17 — Latest Release)

### V17.6.x — Quote Workflow Major Upgrade
- **Quote workspace modal**: Reviewing a quote opens a modal workspace (no page navigation needed)
- **Approval in modal**: Approve/reject directly in the quote modal with required rejection reason
- **PDF preview**: Generate and preview customer-facing quote PDF from the modal
- **Send from modal**: Email and WhatsApp delivery accessible from the quote modal
- **Create order from modal**: Accepted quotes can create orders directly from the quote workspace

### V17.5.x — Pricing Calculator
- Full pricing hierarchy calculator (EXW → FOB → CIF → DDP → Distributor → Retail)
- Organization and category-level default rules
- Product variant-level calculator saves
- Markup vs. Margin mode selector
- Inherited defaults (products start in inherited mode, require explicit override)

### V17.3 — Admin Governance
- Admin → Product Management redesigned as a governance center (not a duplicate editing surface)
- Admin → Categories with taxonomy workbench and parent category support
- Help drawers for complex admin pages

### V17 — Catalog Import/Export
- CSV template downloads for products, categories, pricing, leads
- Import validation with error preview before committing
- Safe import with staging tables

### V16 — Homepage vCard Feature
- Contact Exchange section on marketing homepage
- Smart vCard positioning as a core product feature

### V15 — Unified Mobile vCard
- Consistent vCard share data across all mobile entry points

### V14 — iPhone vCard Polish
- Proper iOS contact format with structured N: fields
- Compressed profile photo for iOS reliability

