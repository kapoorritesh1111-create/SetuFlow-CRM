## 6. PIPELINE — COMPLETE GUIDE

### What is the Pipeline?
A visual Kanban board showing leads organized by pipeline stage. Drag leads between columns to advance them.

### Pipeline Concepts
- **Pipeline**: A named workflow (e.g., "Buyers Pipeline", "Supplier Onboarding")
- **Stage**: A column within a pipeline (e.g., "Prospecting", "Qualified", "Proposal Sent", "Negotiation", "Won")
- Each organization configures their own pipelines and stages in Admin

### Stage Gating
Some stage moves are gated. A lead may be blocked from advancing if:
- Missing required documents
- Open compliance blockers
- Quote not yet sent

### Pipeline Actions
- Drag a lead card to move stage
- Batch-move multiple leads
- View lead signals (deal value, next action, urgency indicator) on each card

