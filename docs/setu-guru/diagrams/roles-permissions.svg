## 18. NOTIFICATIONS & TOASTS

### Global Toast System
All save/error/success feedback appears as **floating toast notifications** (not inline banners).

**Common toast triggers:**
- Saving a record → "Saved successfully"
- Quote approved → "Quote approved"
- Quote rejected → "Quote rejected — revision required"
- Order advanced → "Order state updated"
- Invitation sent → "Invitation sent to [email]"
- Import completed → "Import completed: X rows processed"
- Error → "Something went wrong — please try again"

### `?notice=` URL Parameter
Routes use `?notice=success`, `?notice=error`, etc. to trigger toasts on redirect — so after a server action completes and redirects, the toast appears on the landing page.

