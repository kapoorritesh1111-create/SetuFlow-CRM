## 14. COMPLIANCE & DOCUMENTS — COMPLETE GUIDE

### Documents
- Uploaded at the lead or order level
- Versioned (document_versions table)
- Required documents are defined by `document_requirement_rules`
- Missing required documents create **document blockers** that prevent order advancement

### Compliance Checklist
- Each lead can have compliance checklist items
- Items link to `compliance_checklist_items` and `lead_compliance_items`
- Open compliance blockers prevent order state advancement
- Reviewed by roles with `compliance.review` capability (owner, admin, manager, operations)

