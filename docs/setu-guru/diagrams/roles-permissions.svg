## 24. GLOSSARY

| Term | Definition |
|---|---|
| **Lead** | A buyer or supplier company being managed in the CRM |
| **Pipeline** | A named sequence of stages for moving leads toward a commercial outcome |
| **Stage** | A column in a pipeline (e.g., Prospecting, Qualified, Won) |
| **Quote** | A priced commercial offer sent to a buyer |
| **RFQ** | Request for Quotation — a buyer's request for prices from a supplier |
| **Incoterm** | International commercial term defining delivery responsibility (EXW, FOB, CIF, DDP, etc.) |
| **EXW** | Ex-Works — price at factory gate |
| **FOB** | Free on Board — price at port of origin |
| **CIF** | Cost, Insurance, Freight — price to destination port |
| **DDP** | Delivered Duty Paid — full landed cost at buyer |
| **MOQ** | Minimum Order Quantity |
| **SKU** | Stock Keeping Unit — unique product variant identifier |
| **UOM** | Unit of Measure (kg, pieces, case, etc.) |
| **Contract** | Legal record created after a quote is accepted |
| **vCard** | Digital contact card (.vcf file) that can be saved to a phone |
| **Smart QR** | QR code that opens the public profile card page |
| **Offline QR** | QR code that directly downloads the .vcf contact file |
| **RLS** | Row Level Security — database-level data isolation per organization |
| **Compliance Blocker** | An unresolved compliance checklist item that prevents order advancement |
| **Document Blocker** | A missing required document that prevents order advancement |
| **Approval Threshold** | The discount/markup % beyond which a quote requires human approval (default 15%) |
| **Workspace Mode** | Buyer, Supplier, or All — filters all views to one relationship type |
| **TodayBar** | Priority strip on Dashboard showing leads needing immediate action |
| **Pricing SSOT** | Single Source of Truth — pricing lives in `pricing_rule_sets` + `product_pricing_rules` |
| **Quote SSOT** | Commercial truth lives in `quote_versions` + `quote_version_line_items` |
| **Tenant** | One client organization's isolated workspace |

