## 16. NEW ORGANIZATION ONBOARDING (COMPLETE GUIDE)

### For a Brand New Client Organization

**Step 1: Public Form**
1. Go to `[domain]/onboarding`
2. Fill in: Company name, website, logo URL (optional), HQ country
3. Fill in: First admin name and email
4. Fill in: Desired markets, countries, pipelines, stages
5. Fill in: Pricing notes, product/category notes
6. Submit → confirmation page → Setu admin notified

**Step 2: Setu Admin Provisions Workspace**
1. Admin opens `/admin/client-onboarding`
2. Reviews request details
3. Runs provisioning wizard
4. System creates: organization, markets, countries, pipelines, stages, roles, pricing defaults
5. Admin sends first-admin invitation email

**Step 3: First Admin Accepts Invitation**
1. First admin receives invitation email
2. Clicks secure link → creates Supabase Auth account + password
3. Lands in workspace as Owner
4. Begins workspace setup

**Step 4: Workspace Setup (First Admin)**
1. Go to `/admin/organization` → verify company details, add logo
2. Go to `/admin/pipelines` → review/customize pipelines
3. Go to `/admin/stages` → review/customize stages
4. Go to `/admin/markets` → add/remove target markets
5. Go to `/admin/categories` → create product categories
6. Go to `/products` → add products and variants
7. Go to `/admin/invitations` → invite team members
8. Set roles for each team member

**Step 5: First Lead**
1. Go to `/leads` → click "+ New Lead"
2. Enter buyer/supplier company details
3. Set pipeline, stage, market, owner
4. Save → lead appears in pipeline

**Step 6: First Quote**
1. Open the lead
2. Click "Create Quote"
3. Set incoterm, currency, payment terms
4. Add line items (products + quantities)
5. Save → quote in draft
6. Review → send to customer

