## 9. ORDERS — COMPLETE GUIDE

### Order States (in order)
```
Draft → Ready → Released → Dispatched → Completed
```

### State Descriptions
| State | Meaning |
|---|---|
| **Draft** | Order created from accepted quote, setup in progress |
| **Ready** | All blockers cleared, ready to release to operations |
| **Released** | Operations team has the order |
| **Dispatched** | Goods/services dispatched to buyer |
| **Completed** | Order fulfilled and closed |

### Blockers That Prevent Advancement
To move from Draft → Ready:
- Quote must be accepted
- Contract record must exist
- Contract must be signed
- Commercial lock must be set
- Order must have line items
- Open document blockers must be resolved
- Open compliance blockers must be resolved

### Order → Execution Workflow
1. Quote accepted in Quotes workspace
2. Click **"Create Order"** handoff from quote modal
3. Order appears in `/orders` with Draft state
4. Operations resolves blockers
5. Admin/manager advances state through Ready → Released → Dispatched → Completed

