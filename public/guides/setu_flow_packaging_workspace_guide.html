','Choose service family','Choose pricing template','Enter dimensions','Enter repeat and web width','Select material','Select finish and colors','Enter quantity','Review calculated pricing','Add another line','Save draft','Review customer-facing quote'],'Configure packaging specifications and calculate a reliable quote.','/quotes/new',''],['approval','Approvals & Sending',8,['Review approval requirements','Submit for approval','Approve or return','Resolve approval changes','Generate approval link','Send to buyer','Record buyer response','Create order handoff'],'Approve, share and hand off a quote without losing control.','/quotes','evidence/00-reference-09-quote-lifecycle.png'],['followup','Follow-up',6,['Open Quote Lifecycle','Review recommended action','Send follow-up','Handle revision request','Manage expiring quotes','Close or hand off'],'Keep every sent quote moving toward a decision.','/quotes','evidence/00-reference-09-quote-lifecycle.png'],['design','Design & Proofs',5,['Open Design Queue','Review production specification','Upload proof version','Share and record approval','Release to pre-press'],'Move accepted artwork from intake to print-ready approval.','/design-queue',''],['dispatch','Production & Dispatch',4,['Open Dispatch Board','Advance production stage','Correct stage and print ticket','Mark dispatched'],'Track accepted jobs through production and shipment.','/dispatch-board',''],['admin','Catalog & Admin',3,['Manage service families','Manage pricing templates','Maintain reference library'],'Maintain the controlled data that powers quoting.','/admin','']];let W=defs.map(d=>({id:d[0],name:d[1],summary:d[3],route:d[4],img:d[5],steps:d[2].map((t,i)=>({id:d[0]+'-'+(i+1),title:t,overview:d[3],actions:actionText(d[0],t),expected:expectedText(d[0],t),mistakes:mistakeText(d[0],t)}))}));function actionText(w,t){let a=['Open the matching workspace from the Setu Flow sidebar.','Complete “'+t+'” using visible buttons and fields.','Wait for the success state and verify the saved record before moving on.'];if(w==='quote')a=['Open the quote from the qualified lead.','Complete “'+t+'” and review every pricing input.','Confirm the line name, currency, pricing breakdown and saved draft.'];if(w==='dispatch')a=['Open Dispatch Board and locate the correct job.','Complete “'+t+'” only after physical work is complete.','Confirm the stage event and job status update.'];return a}function expectedText(w,t){return t+' completes successfully, persists after refresh and leaves the record in the correct next state.'}function mistakeText(w,t){return['Using a URL instead of learning the visible click path.','Leaving before the save or success confirmation appears.','Continuing when the company, quote line or production job is not the intended record.']}const flat=W.flatMap(w=>w.steps.map((s,i)=>({...s,wid:w.id,wname:w.name,route:w.route,img:w.img,index:i})));let S={view:'dash',mode:'learn',role:'sales',step:'capture-1',done:[],results:{},tester:'',device:'Chrome / Desktop'};try{S={...S,...JSON.parse(localStorage.getItem('setu-packaging-academy')||'{}')}}catch(e){}let tab='overview';function save(){localStorage.setItem('setu-packaging-academy',JSON.stringify(S))}function step(id=S.step){return flat.find(x=>x.id===id)||flat[0]}function roleSteps(){return flat.filter(x=>R[S.role][2].includes(x.wid))}function allowedW(all=false){return all?W:W.filter(x=>R[S.role][2].includes(x.id))}function prog(arr){let d=arr.filter(x=>S.done.includes(x.id)).length;return[d,arr.length,arr.length?Math.round(d/arr.length*100):0]}function esc(x=''){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function init(){role.innerHTML=Object.entries(R).map(([k,v])=>'<option value="'+k+'">Role: '+v[0]+'</option>').join('');role.value=S.role;render();go(S.view,false)}function mode(m){S.mode=m;save();go(m==='test'?'test':'learn')}function setRole(r){S.role=r;if(!roleSteps().some(x=>x.id===S.step))S.step=roleSteps()[0].id;save();render();go('dash',false)}function go(v,re=true){S.view=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById(v).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));learnBtn.classList.toggle('on',v!=='test');testBtn.classList.toggle('on',v==='test');if(re)render()}function render(){renderDash();renderLesson('learn',false);renderLesson('all',true);renderTest();renderReport();renderIssues()}function renderDash(){let p=prog(roleSteps()),cur=step();dash.innerHTML='<div class="head"><div><h1>Packaging Academy Dashboard</h1><p>Choose your role, continue training, or validate the live workspace.</p></div><button class="btn" onclick="go(\'learn\')">Continue Journey →</button></div><div class="welcome"><div class="card hello"><i>✦</i><div><h2>Welcome, '+R[S.role][0]+' team!</h2><p>Use Learn Mode first, then complete the same clicks in Test Mode.</p></div></div><div class="card metric"><small>Overall progress</small><strong>'+p[2]+'%</strong><div class="bar"><span style="width:'+p[2]+'%"></span></div></div><div class="card metric"><small>Tests completed</small><strong>'+Object.keys(S.results).length+' / '+roleSteps().length+'</strong></div></div><div class="card pad section"><h2>Choose Your Role</h2><div class="roles">'+Object.entries(R).map(([k,v])=>'<button class="role '+(k===S.role?'on':'')+'" onclick="setRole(\''+k+'\')"><i>'+v[0][0]+'</i><b>'+v[0]+'</b><small>'+v[1]+'</small></button>').join('')+'</div></div><div class="card pad section"><div class="head" style="margin:0"><div><h2>Recommended Journey for '+R[S.role][0]+'</h2><p>Complete each workflow in sequence.</p></div></div><div class="journey">'+allowedW().map((w,i)=>{let q=prog(w.steps);return'<div class="node '+(q[2]===100?'done':'')+'"><i>'+(q[2]===100?'✓':i+1)+'</i><b>'+w.name+'</b><small>'+q[0]+'/'+q[1]+' complete</small></div>'}).join('')+'</div></div><div class="card pad section"><b>Resume where you left off:</b> <span style="color:var(--m)">'+cur.wname+' · '+cur.title+'</span> <button class="btn" style="float:right" onclick="go(\'learn\')">Continue</button></div>'}function navHtml(all){return'<div class="stepsnav">'+allowedW(all).map((w,wi)=>'<div class="wf"><button onclick="pick(\''+w.steps[0].id+'\')">'+(wi+1)+'. '+w.name+'</button>'+w.steps.map((s,si)=>'<button class="stepbtn '+(s.id===S.step?'on ':'')+(S.done.includes(s.id)?'done':'')+'" onclick="pick(\''+s.id+'\')">'+(wi+1)+'.'+(si+1)+' '+s.title+'</button>').join('')+'</div>').join('')+'</div>'}function shotHtml(s){return'<div><div class="shot">'+(s.img?'<img src="'+s.img+'" alt="'+esc(s.title)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><div class="ph" style="display:none">Screenshot unavailable in this build.<br>Use the written click path.</div>':'<div class="ph">Screenshot placeholder<br><small>Capture can be linked from the evidence library.</small></div>')+'<i class="hot" style="left:18%;top:18%">1</i><i class="hot" style="left:55%;top:46%">2</i><i class="hot" style="left:82%;top:76%">3</i></div><p style="text-align:center;color:var(--m);font-size:9px">Use the numbered hotspots with the written instructions.</p></div>'}function renderLesson(id,all){let s=step();if(!all&&!R[S.role][2].includes(s.wid)){S.step=roleSteps()[0].id;s=step()}document.getElementById(id).innerHTML='<div class="head"><div><h1>'+(all?'All Packaging Workflows':'My '+R[S.role][0]+' Journey')+'</h1><p>Guided click-by-click learning with expected results.</p></div></div><div class="card split">'+navHtml(all)+'<article class="lesson"><div class="lessonhead"><div class="crumb">'+s.wname+' › Step '+(s.index+1)+' › '+s.title+'</div><div class="titleline"><div><h1>'+s.title+'</h1><p>'+s.overview+'</p></div><button class="btn" onclick="window.open(\''+s.route+'\',\'_blank\',\'noopener\')">Open in Setu Flow ↗</button></div><div class="tabs">'+[['overview','Overview'],['steps','Steps'],['screenshot','Screenshot'],['expected','Expected Result'],['mistakes','Common Mistakes']].map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\',\''+id+'\','+all+')">'+x[1]+'</button>').join('')+'</div></div><div class="lessonbody">'+tabBody(s)+' </div><div class="lessonfoot"><button class="btn" onclick="move(-1,'+all+')">← Previous</button><label><input type="checkbox" '+(S.done.includes(s.id)?'checked':'')+' onchange="complete(\''+s.id+'\',this.checked)"> Mark Step Complete</label><button class="btn primary" onclick="move(1,'+all+')">Next →</button></div></article></div>'}function tabBody(s){if(tab==='screenshot')return shotHtml(s);if(tab==='expected')return'<div class="box ok"><h3>Expected Result</h3><p>'+s.expected+'</p></div>';if(tab==='mistakes')return'<div class="box"><h3>Common Mistakes</h3><ul>'+s.mistakes.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';let list='<ol class="list">'+s.actions.map((x,i)=>'<li><b>'+(i?'Then':'Complete this action')+'</b><p>'+x+'</p></li>').join('')+'</ol>';return tab==='steps'?list:list+shotHtml(s)+'<div class="boxes"><div class="box ok"><h3>Expected Result</h3><p>'+s.expected+'</p></div><div class="box"><h3>Common Mistakes</h3><ul>'+s.mistakes.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>'}function setTab(t,id,all){tab=t;renderLesson(id,all)}function pick(id){S.step=id;save();render();go(S.view,false)}function move(n,all){let a=all?flat:roleSteps(),i=a.findIndex(x=>x.id===S.step);S.step=a[(i+n+a.length)%a.length].id;save();render();go(S.view,false)}function complete(id,on){S.done=on?[...new Set([...S.done,id])]:S.done.filter(x=>x!==id);save();render();go(S.view,false);toast('Training progress saved')}function renderTest(){let s=step(),r=S.results[s.id]||{};test.innerHTML='<div class="head"><div><h1>Test Center</h1><p>Execute the learning step in the live workspace and record what actually happened.</p></div><button class="btn" onclick="go(\'learn\')">View Learn Mode</button></div><div class="card split">'+navHtml(false)+'<div class="test"><div class="crumb">'+s.wname+' · Test Step '+(s.index+1)+'</div><div class="titleline"><div><h1>'+s.title+'</h1><p>'+s.overview+'</p></div><button class="btn" onclick="window.open(\''+s.route+'\',\'_blank\',\'noopener\')">Open live step ↗</button></div><div class="radios">'+[['pass','Pass'],['fail','Fail'],['blocked','Blocked'],['na','N/A']].map(x=>'<label><input type="radio" name="res" value="'+x[0]+'" '+(r.result===x[0]?'checked':'')+'> '+x[1]+'</label>').join('')+'</div><div class="field"><label>Actual Result</label><textarea id="actual" placeholder="What happened when you executed this step?">'+esc(r.actual||'')+'</textarea></div><div class="form2" style="margin-top:10px"><div class="field"><label>Notes / Issues</label><textarea id="notes" placeholder="Error messages, observations and reproduction details...">'+esc(r.notes||'')+'</textarea></div><div class="field"><label>Evidence</label><input id="evidence" type="file" accept="image/*"><p style="font-size:9px;color:var(--m)">The filename is saved in the local report. Attach the actual screenshot to the issue tracker when reporting a defect.</p></div></div><div class="form2" style="margin-top:10px"><div class="field"><label>Tester Name</label><input id="tester" value="'+esc(S.tester||'')+'"></div><div class="field"><label>Browser / Device</label><input id="device" value="'+esc(S.device||'')+'"></div></div><div style="display:flex;justify-content:space-between;margin-top:15px"><button class="btn" onclick="move(-1,false)">← Previous</button><div><button class="btn" onclick="saveTest(false)">Save Result</button> <button class="btn primary" onclick="saveTest(true)">Save & Next →</button></div></div></div></div>'}function saveTest(next){let r=document.querySelector('input[name=res]:checked')?.value;if(!r)return toast('Choose Pass, Fail, Blocked or N/A');let s=step();S.tester=tester.value.trim();S.device=device.value.trim();S.results[s.id]={result:r,actual:actual.value.trim(),notes:notes.value.trim(),evidence:evidence.files[0]?.name||S.results[s.id]?.evidence||'',tester:S.tester,device:S.device,time:new Date().toISOString()};save();toast('Test result saved locally');if(next){let a=roleSteps(),i=a.findIndex(x=>x.id===S.step);S.step=a[(i+1)%a.length].id;save()}render();go('test',false)}function counts(a=flat){let c={pass:0,fail:0,blocked:0,na:0,untested:0};a.forEach(x=>{let r=S.results[x.id]?.result;r?c[r]++:c.untested++});return c}function renderReport(){let c=counts(),tested=flat.length-c.untested,p=Math.round(tested/flat.length*100);let ms=[['Total Tests',flat.length],['Passed',c.pass],['Failed',c.fail],['Blocked',c.blocked],['N/A',c.na],['Completion',p+'%']];report.innerHTML='<div class="head"><div><h1>Test Report Summary</h1><p>Results are stored in this browser until exported.</p></div><div><button class="btn" onclick="window.print()">Export PDF / Print</button> <button class="btn" onclick="csv()">Export CSV</button></div></div><div class="summary">'+ms.map(x=>'<div class="card sum"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="card table section"><table><thead><tr><th>Workflow</th><th>Total</th><th>Passed</th><th>Failed</th><th>Blocked</th><th>N/A</th><th>Progress</th></tr></thead><tbody>'+W.map(w=>{let x=counts(w.steps),t=w.steps.length-x.untested,q=Math.round(t/w.steps.length*100);return'<tr><td>'+w.name+'</td><td>'+w.steps.length+'</td><td>'+x.pass+'</td><td>'+x.fail+'</td><td>'+x.blocked+'</td><td>'+x.na+'</td><td>'+q+'%</td></tr>'}).join('')+'</tbody></table></div>'}function csv(){let rows=[['Workflow','Step','Result','Actual Result','Notes','Evidence','Tester','Device','Date/Time']];flat.forEach(s=>{let r=S.results[s.id]||{};rows.push([s.wname,s.title,r.result||'Untested',r.actual||'',r.notes||'',r.evidence||'',r.tester||'',r.device||'',r.time||''])});let out=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='setu-flow-packaging-test-results.csv';a.click()}const I=[['P0','PKG-JOURNEY-009','Approval action can lock the quote incorrectly'],['P1','PKG-JOURNEY-010','Generic product line can create a mixed-currency total'],['P1','PKG-JOURNEY-011','Pricing step may show the wrong line name'],['P2','PKG-JOURNEY-012','Template warning can remain after switching templates'],['P1','PKG-JOURNEY-013','Design Queue can show stale artwork status'],['P2','PKG-JOURNEY-014','MOQ validation does not always suggest an alternative'],['P2','PKG-JOURNEY-015','Copy approval link lacks visible confirmation'],['P1','PKG-JOURNEY-016','Some pages contain duplicate interactive elements']];function renderIssues(){issues.innerHTML='<div class="head"><div><h1>Current Testing Issues</h1><p>Active advisories from the packaging journey retest.</p></div><button class="btn" onclick="go(\'test\')">Start testing</button></div>'+I.map(x=>'<div class="card issue"><div class="sev '+x[0].toLowerCase()+'">'+x[0]+'</div><div><h3>'+x[1]+' · '+x[2]+'</h3><p>Validate this behavior carefully and capture evidence when the result differs from the expected workflow.</p></div><span class="pill">Open</span></div>').join('')}function searchStep(q){q=q.toLowerCase().trim();if(q.length<2)return;let hit=flat.find(x=>(x.title+' '+x.overview+' '+x.wname).toLowerCase().includes(q));if(hit){S.step=hit.id;save();render();go('all',false)}}function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}init();</script></body></html>
