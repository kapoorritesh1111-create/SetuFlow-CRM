<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SETU Flow — Background Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;width:100vw;height:100vh;background:#060b16}

.bg-video{
  position:fixed;inset:0;z-index:0;overflow:hidden;
}

.slide{
  position:absolute;inset:-8%;/* bleed outside viewport for pan room */
  width:116%;height:116%;
  opacity:0;
  transition:opacity 1.8s ease-in-out;
  will-change:opacity;
}
.slide.active{opacity:1}

.slide img{
  position:absolute;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center center;
  will-change:transform;
  /* Base zoom so UI text isn't readable — atmospheric only */
  filter:saturate(.75) brightness(.7) contrast(1.05);
  transition:transform 6s cubic-bezier(.25,.1,.25,1);
}

/* Ken Burns — subtle, cinematic movements */
.slide[data-kb="zo"] img{transform:scale(1.08)}
.slide[data-kb="zo"].active img{transform:scale(1)}

.slide[data-kb="zi"] img{transform:scale(1)}
.slide[data-kb="zi"].active img{transform:scale(1.08)}

.slide[data-kb="pr"] img{transform:scale(1.06) translateX(-2%)}
.slide[data-kb="pr"].active img{transform:scale(1.06) translateX(2%)}

.slide[data-kb="pl"] img{transform:scale(1.06) translateX(2%)}
.slide[data-kb="pl"].active img{transform:scale(1.06) translateX(-2%)}

.slide[data-kb="pu"] img{transform:scale(1.06) translateY(3%)}
.slide[data-kb="pu"].active img{transform:scale(1.06) translateY(-2%)}

.slide[data-kb="dr"] img{transform:scale(1.07) translate(-1.5%,1%)}
.slide[data-kb="dr"].active img{transform:scale(1.07) translate(1.5%,-1%)}

.slide[data-kb="sr"] img{transform:scale(1.12)}
.slide[data-kb="sr"].active img{transform:scale(1.02)}

/* Consistent dark overlay — sits ON TOP of all slides */
.overlay{
  position:fixed;inset:0;z-index:1;
  background:
    linear-gradient(180deg,
      rgba(6,11,22,.50) 0%,
      rgba(6,11,22,.32) 25%,
      rgba(6,11,22,.28) 50%,
      rgba(6,11,22,.32) 75%,
      rgba(6,11,22,.55) 100%
    );
  pointer-events:none;
}

/* Vignette for cinematic edges */
.vignette{
  position:fixed;inset:0;z-index:2;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(6,11,22,.6) 100%);
  pointer-events:none;
}

/* Subtle color wash — ties everything to brand palette */
.color-wash{
  position:fixed;inset:0;z-index:1;
  background:linear-gradient(135deg,rgba(31,72,124,.08) 0%,transparent 50%,rgba(39,148,145,.06) 100%);
  pointer-events:none;
  mix-blend-mode:screen;
}

/* Progress */
.progress{position:fixed;bottom:0;left:0;height:2px;z-index:3;background:linear-gradient(90deg,rgba(39,148,145,.4),rgba(52,211,197,.4));transition:width .15s linear}
</style>
</head>
<body>
<div class="bg-video" id="bgv">
  <div class="slide" data-kb="zo"><img src="/marketing/ss-capture-lead.jpg" alt=""/></div>
  <div class="slide" data-kb="pr"><img src="/marketing/ss-vcard.jpg" alt=""/></div>
  <div class="slide" data-kb="pl"><img src="/marketing/ss-quotebuilder.jpg" alt=""/></div>
  <div class="slide" data-kb="dr"><img src="/marketing/pipeline-commercial-view.png" alt=""/></div>
  <div class="slide" data-kb="zi"><img src="/marketing/ss-orders.jpg" alt=""/></div>
  <div class="slide" data-kb="pu"><img src="/marketing/ss-analytics.jpg" alt=""/></div>
  <div class="slide" data-kb="sr"><img src="/marketing/ss-dashboard.jpg" alt=""/></div>
</div>
<div class="overlay"></div>
<div class="color-wash"></div>
<div class="vignette"></div>
<div class="progress" id="pb"></div>
<script>
const D=5000,slides=document.querySelectorAll('.slide'),pb=document.getElementById('pb');
const N=slides.length,T=N*D;
let cur=-1,st=Date.now();
function go(i){
  if(i===cur)return;
  const s=slides[i],img=s.querySelector('img');
  // Reset KB
  img.style.transition='none';
  s.classList.remove('active');
  void img.offsetHeight;
  img.style.transition='';
  // Swap
  if(cur>=0)slides[cur].classList.remove('active');
  cur=i;
  slides[cur].classList.add('active');
}
function tick(){
  const e=Date.now()-st,l=e%T,si=Math.floor(l/D)%N,p=(l/T)*100;
  pb.style.width=p+'%';
  if(si!==cur)go(si);
  requestAnimationFrame(tick);
}
// Preload
let ld=0;
slides.forEach(s=>{const img=s.querySelector('img');if(img.complete)ld++;else img.onload=()=>{ld++;if(ld===N)st=Date.now();}});
st=Date.now();
requestAnimationFrame(tick);
</script>
</body>
</html>
