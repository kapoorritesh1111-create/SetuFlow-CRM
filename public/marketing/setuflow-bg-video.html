<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SETU Flow — Background Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;width:100vw;height:100vh;background:#060b16}
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(145deg,#060b16,#0c1829)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease-in-out;will-change:opacity;display:flex;align-items:center;justify-content:center}
.slide.active{opacity:1}

/* Landscape screenshots — fill viewport */
.slide img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(.8) brightness(.85);will-change:transform;transition:transform 6s cubic-bezier(.25,.1,.25,1)}

/* Portrait override (vCard) — contain, centered on dark bg */
.slide.portrait img{object-fit:contain;object-position:center center;filter:saturate(.85) brightness(.8)}

/* Wide/short override (analytics) — cover but position top */
.slide.wide img{object-position:center top}

/* Ken Burns */
.slide[data-kb="zo"] img{transform:scale(1.08)}
.slide[data-kb="zo"].active img{transform:scale(1.01)}
.slide[data-kb="zi"] img{transform:scale(1.01)}
.slide[data-kb="zi"].active img{transform:scale(1.07)}
.slide[data-kb="pr"] img{transform:scale(1.05) translateX(-1.5%)}
.slide[data-kb="pr"].active img{transform:scale(1.05) translateX(1.5%)}
.slide[data-kb="pl"] img{transform:scale(1.05) translateX(1.5%)}
.slide[data-kb="pl"].active img{transform:scale(1.05) translateX(-1.5%)}
.slide[data-kb="pu"] img{transform:scale(1.05) translateY(2%)}
.slide[data-kb="pu"].active img{transform:scale(1.05) translateY(-2%)}
.slide[data-kb="dr"] img{transform:scale(1.06) translate(-1%,.5%)}
.slide[data-kb="dr"].active img{transform:scale(1.06) translate(1%,-.5%)}
.slide[data-kb="sr"] img{transform:scale(1.1)}
.slide[data-kb="sr"].active img{transform:scale(1.01)}

/* Overlay — light enough to see content, dark enough for text on top */
.overlay{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,11,22,.3) 0%,rgba(6,11,22,.1) 30%,rgba(6,11,22,.1) 70%,rgba(6,11,22,.35) 100%);pointer-events:none}
.vignette{position:fixed;inset:0;z-index:2;background:radial-gradient(ellipse at center,transparent 50%,rgba(6,11,22,.4) 100%);pointer-events:none}
.wash{position:fixed;inset:0;z-index:1;background:linear-gradient(135deg,rgba(31,72,124,.05) 0%,transparent 50%,rgba(39,148,145,.04) 100%);pointer-events:none;mix-blend-mode:screen}
.progress{position:fixed;bottom:0;left:0;height:2px;z-index:3;background:linear-gradient(90deg,rgba(39,148,145,.5),rgba(52,211,197,.5));transition:width .15s linear}
</style>
</head>
<body>
<div class="stage">
  <!-- 1. Lead Capture — 1600x1006, good landscape -->
  <div class="slide" data-kb="zo"><img src="/marketing/ss-capture-lead.jpg" alt=""/></div>
  <!-- 2. vCard — 365x782 PORTRAIT — use contain -->
  <div class="slide portrait" data-kb="zi"><img src="/marketing/ss-vcard.jpg" alt=""/></div>
  <!-- 3. Quote Builder — 1600x1181, tall landscape -->
  <div class="slide" data-kb="pl"><img src="/marketing/ss-quotebuilder.jpg" alt=""/></div>
  <!-- 4. Pipeline — 1628x969, good landscape -->
  <div class="slide" data-kb="dr"><img src="/marketing/pipeline-commercial-view.png" alt=""/></div>
  <!-- 5. Orders — 1600x987, good landscape -->
  <div class="slide" data-kb="pr"><img src="/marketing/ss-orders.jpg" alt=""/></div>
  <!-- 6. Analytics — 1600x467, ULTRA WIDE -->
  <div class="slide wide" data-kb="pu"><img src="/marketing/ss-analytics.jpg" alt=""/></div>
  <!-- 7. Dashboard — 1600x667, wide -->
  <div class="slide" data-kb="sr"><img src="/marketing/ss-dashboard.jpg" alt=""/></div>
</div>
<div class="overlay"></div>
<div class="wash"></div>
<div class="vignette"></div>
<div class="progress" id="pb"></div>
<script>
const D=5000,slides=document.querySelectorAll('.slide'),pb=document.getElementById('pb');
const N=slides.length,T=N*D;
let cur=-1,st=Date.now();
function go(i){
  if(i===cur)return;
  const s=slides[i],img=s.querySelector('img');
  img.style.transition='none';
  s.classList.remove('active');
  void img.offsetHeight;
  img.style.transition='';
  if(cur>=0)slides[cur].classList.remove('active');
  cur=i;
  slides[cur].classList.add('active');
}
function tick(){
  const l=(Date.now()-st)%T,si=Math.floor(l/D)%N;
  pb.style.width=((l/T)*100)+'%';
  if(si!==cur)go(si);
  requestAnimationFrame(tick);
}
let ld=0;
slides.forEach(s=>{const img=s.querySelector('img');if(img.complete)ld++;else img.onload=()=>{ld++;if(ld===N)st=Date.now();}});
st=Date.now();requestAnimationFrame(tick);
</script>
</body>
</html>
