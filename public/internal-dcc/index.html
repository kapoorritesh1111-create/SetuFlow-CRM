<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setu Flow CRM — Internal Development Command Center</title>
<style>
:root{--bg:#08111f;--panel:#10192c;--panel2:#16233b;--border:#2a3a5f;--text:#ebf2ff;--muted:#9eb0d3;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#60a5fa;--cyan:#22d3ee;--shadow:0 12px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,#08111f 0%,#0d1628 100%)}
.shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.sidebar{padding:20px;border-right:1px solid var(--border);background:rgba(8,17,31,.96);position:sticky;top:0;height:100vh;overflow:auto}.main{padding:24px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#22d3ee);box-shadow:var(--shadow)}.brand h1{margin:0;font-size:16px}.brand p,.muted{color:var(--muted)}.brand p{margin:4px 0 0;font-size:12px}
.meta,.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.meta{padding:14px;margin-bottom:18px}.meta .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:6px 0}.meta strong{color:var(--text)}
.nav a{display:block;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;margin-bottom:6px;border:1px solid transparent}.nav a:hover,.nav a.active{color:var(--text);background:var(--panel2);border-color:var(--border)}
.section{display:none}.section.active{display:block}.header{margin-bottom:18px}.header h2{margin:0 0 8px;font-size:28px}.header p{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:18px}.card h3{margin:0 0 12px;font-size:16px}.kpi{font-size:30px;font-weight:700;margin-bottom:6px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.good{background:rgba(34,197,94,.15);color:#7ae5a0}.warn{background:rgba(245,158,11,.15);color:#ffd27f}.bad{background:rgba(239,68,68,.15);color:#ff9b9b}.bar{width:100%;height:10px;background:#0b1323;border:1px solid var(--border);border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}.list{margin:0;padding-left:18px}.list li{margin:8px 0}.svg-wrap{background:#0b1323;border:1px solid var(--border);border-radius:16px;padding:12px;overflow:auto}.diagram text{fill:var(--text);font-size:12px;font-family:Inter,system-ui,sans-serif}.diagram .node{fill:#10192c;stroke:#3b4f79;stroke-width:1.5}.diagram .accent{fill:#132442;stroke:#60a5fa}.diagram .warnNode{fill:#2d2210;stroke:#d97706}.diagram .badNode{fill:#341616;stroke:#ef4444}.diagram .line{stroke:#22d3ee;stroke-width:2}.banner{padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,#132442,#10192c);margin-bottom:16px}.banner strong{display:block;margin-bottom:8px}.code{background:#0b1323;border:1px solid var(--border);border-radius:14px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
@media (max-width:1100px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><div class="logo"></div><div><h1>Setu Flow CRM DCC</h1><p>Internal-only investor, buyer, and engineering truth surface</p></div></div>
<div class="meta" id="sidebarMeta"></div>
<nav class="nav" id="nav"></nav>
</aside>
<main class="main">
<div class="header"><h2 id="pageTitle">Overview Dashboard</h2><p id="pageSubtitle">Repo-backed truth after PR-29 release-gate work, updated against live Supabase demo data and investor-readiness reality.</p></div>
<div id="sections"></div>
</main>
</div>
<script>
const STATE={
 repo:{baseline:'PR-29 governed repo baseline, now corrected against live demo data',sourceOfTruth:'public/internal-dcc/index.html',canonicalManifest:'src/lib/routes/manifest.json',lastVerifiedAgainstRepo:'Current uploaded repo + live data audit',routeTruth:'Manifest-backed routes; readiness claims reset to match data proof'},
 overview:{engineering:86,demo:81,buyer:76,investor:72,documentation:90,risk:34},
 data:{buyers:35,suppliers:10,products:21,variants:31,quotes:8,contracts:3,documents:7,integrations:0},
 findings:[
  'The live workspace is materially populated and demoable.',
  'Pricing policy correctly preserves override approval intent.',
  'Accepted quote truth is inconsistent between summary state and negotiation events.',
  'Contracts exist, but visible execution proof remains draft-heavy.',
  'Integration claims must remain conservative until live connectors are configured.'
 ],
 modules:[
  ['Leads',88,'good','Real buyer/supplier coverage and meaningful commercial context are present.'],
  ['Pipeline',82,'good','Stages and next steps exist, but golden demo sequencing still needs tighter curation.'],
  ['Quotes',78,'warn','Quote volume is real, but accepted-state and approval proof are not yet fully reconciled.'],
  ['Contracts / Orders',74,'warn','Contracts exist with partial continuity, but draft-heavy execution posture weakens proof.'],
  ['Dashboard',80,'good','Good for guided demo, but should avoid overclaiming end-state maturity.'],
  ['Products / Catalog',87,'good','Catalog coverage is strong enough for buyer and investor walkthroughs.'],
  ['AI',63,'warn','Keep AI claims bounded and operator-reviewed.'],
  ['Integrations',42,'bad','Architecture exists, live configured proof does not.'],
  ['Documentation',90,'good','Docs now align to current repo and live data truth.']
 ],
 prs:[
  ['PR-29','Complete',100,'Release-gate and hygiene hardening remain part of the baseline.'],
  ['PR-30','Complete',100,'Truth reset: DCC, README, architecture, workflow, and readiness docs corrected against live data.'],
  ['PR-31','Next',0,'Reconcile accepted quote truth and surface one clean approval-governed commercial path.']
 ],
 blockers:[
  'Quote summary state does not yet cleanly match accepted negotiation events.',
  'Current visible quote records do not showcase a strong approval-required pricing example.',
  'Visible contract examples remain in draft execution posture.',
  'Integrations are not configured in live demo data.'
 ],
 roadmap:[
  ['Immediate','Reconcile quote acceptance truth across quotes, versions, events, and contracts.'],
  ['Immediate','Surface one approval-governed quote path in the product and demo materials.'],
  ['Next','Tighten contract/order execution proof beyond draft state.'],
  ['Next','Keep integration claims narrow until one live connector path is proven.']
 ]
};
const sections=[['overview','Overview Dashboard'],['workflow','Unified Workflow'],['modules','Module Heatmap'],['readiness','Readiness and Risks'],['docs','Documentation'],['prs','PR Tracker'],['roadmap','Roadmap']];
const el=(tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!==undefined)n.innerHTML=html;return n};
const progress=(label,value)=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>${label}</span><strong>${value}%</strong></div><div class="bar"><span style="width:${value}%"></span></div></div>`;
const pillClass=(v)=>v>=85?'good':v>=65?'warn':'bad';
function renderSidebar(){const meta=document.getElementById('sidebarMeta');meta.innerHTML=`<div class="row"><span>Baseline</span><strong>${STATE.repo.baseline}</strong></div><div class="row"><span>Source of truth</span><strong>${STATE.repo.sourceOfTruth}</strong></div><div class="row"><span>Canonical manifest</span><strong>${STATE.repo.canonicalManifest}</strong></div><div class="row"><span>Important legacy anchor</span><strong>PR-29 remains part of the governed baseline</strong></div>`;const nav=document.getElementById('nav');sections.forEach(([id,label])=>{const a=el('a','',label);a.href='#'+id;a.dataset.target=id;nav.appendChild(a);});}
const renderers={
 overview:()=>`<div class="banner"><strong>Current verdict</strong>Setu Flow is a credible trade workflow product with real commercial data, but it is not yet ready for “everything complete” investor positioning. The repo is stronger than the current proof discipline.</div><div class="grid four"><div class="card"><h3>Engineering</h3><div class="kpi">${STATE.overview.engineering}%</div>${progress('Repo baseline',STATE.overview.engineering)}</div><div class="card"><h3>Demo</h3><div class="kpi">${STATE.overview.demo}%</div>${progress('Demo readiness',STATE.overview.demo)}</div><div class="card"><h3>Buyer</h3><div class="kpi">${STATE.overview.buyer}%</div>${progress('Buyer readiness',STATE.overview.buyer)}</div><div class="card"><h3>Investor</h3><div class="kpi">${STATE.overview.investor}%</div>${progress('Investor readiness',STATE.overview.investor)}</div></div><div class="grid four" style="margin-top:16px"><div class="card"><h3>Buyers</h3><div class="kpi">${STATE.data.buyers}</div></div><div class="card"><h3>Suppliers</h3><div class="kpi">${STATE.data.suppliers}</div></div><div class="card"><h3>Products / Variants</h3><div class="kpi">${STATE.data.products} / ${STATE.data.variants}</div></div><div class="card"><h3>Quotes / Contracts</h3><div class="kpi">${STATE.data.quotes} / ${STATE.data.contracts}</div></div></div><div class="card" style="margin-top:16px"><h3>Key findings</h3><ul class="list">${STATE.findings.map(x=>`<li>${x}</li>`).join('')}</ul></div>`,
 workflow:()=>`<div class="card"><h3>Unified commercial workflow</h3><div class="svg-wrap"><svg class="diagram" viewBox="0 0 1120 320" width="100%" height="320" role="img" aria-label="Unified workflow diagram"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker></defs><rect class="node accent" x="20" y="120" rx="14" ry="14" width="120" height="56"></rect><text x="80" y="152" text-anchor="middle">Capture</text><rect class="node" x="170" y="120" rx="14" ry="14" width="120" height="56"></rect><text x="230" y="152" text-anchor="middle">Lead</text><rect class="node" x="320" y="110" rx="14" ry="14" width="170" height="76"></rect><text x="405" y="145" text-anchor="middle">Product / Category</text><text x="405" y="162" text-anchor="middle">Interest</text><rect class="node accent" x="520" y="120" rx="14" ry="14" width="120" height="56"></rect><text x="580" y="152" text-anchor="middle">Quote</text><rect class="node warnNode" x="670" y="60" rx="14" ry="14" width="170" height="70"></rect><text x="755" y="92" text-anchor="middle">Approval when</text><text x="755" y="109" text-anchor="middle">override policy triggers</text><rect class="node" x="670" y="180" rx="14" ry="14" width="170" height="70"></rect><text x="755" y="212" text-anchor="middle">Contract / Order</text><text x="755" y="229" text-anchor="middle">continuity</text><rect class="node" x="870" y="180" rx="14" ry="14" width="120" height="70"></rect><text x="930" y="212" text-anchor="middle">Execution</text><text x="930" y="229" text-anchor="middle">controls</text><rect class="node badNode" x="1010" y="180" rx="14" ry="14" width="100" height="70"></rect><text x="1060" y="212" text-anchor="middle">Freight /</text><text x="1060" y="229" text-anchor="middle">Finance</text><line class="line" x1="140" y1="148" x2="170" y2="148" marker-end="url(#arrow)"/><line class="line" x1="290" y1="148" x2="320" y2="148" marker-end="url(#arrow)"/><line class="line" x1="490" y1="148" x2="520" y2="148" marker-end="url(#arrow)"/><line class="line" x1="640" y1="148" x2="670" y2="95" marker-end="url(#arrow)"/><line class="line" x1="640" y1="148" x2="670" y2="215" marker-end="url(#arrow)"/><line class="line" x1="840" y1="215" x2="870" y2="215" marker-end="url(#arrow)"/><line class="line" x1="990" y1="215" x2="1010" y2="215" marker-end="url(#arrow)"/></svg></div><ul class="list"><li>Base catalog pricing remains the default commercial rule.</li><li>Quote override requires reason and approval policy must stay intact.</li><li>The current live data proves lead, quote, and partial contract continuity more clearly than it proves execution maturity.</li></ul></div>`,
 modules:()=>`<div class="card"><h3>Module heatmap</h3><table class="table"><tr><th>Module</th><th>Readiness</th><th>Signal</th><th>Why</th></tr>${STATE.modules.map(([n,p,s,d])=>`<tr><td>${n}</td><td>${p}%</td><td><span class="pill ${s}">${s.toUpperCase()}</span></td><td>${d}</td></tr>`).join('')}</table></div>`,
 readiness:()=>`<div class="grid two"><div class="card"><h3>What is strong</h3><ul class="list"><li>Real buyer and supplier coverage exists.</li><li>Catalog breadth is commercially useful.</li><li>Pricing policy correctly keeps override governance.</li><li>Some downstream continuity snapshots are already meaningful.</li><li>PR-29 repo hygiene and release-gate work remain valuable and should stay protected.</li></ul></div><div class="card"><h3>What breaks trust</h3><ul class="list"><li>Accepted events exist without a reconciled accepted summary posture.</li><li>Approval-required proof is not surfaced cleanly in the visible quote data.</li><li>Execution appears structurally present but still draft-heavy.</li><li>Integration claims would outrun live proof.</li></ul></div><div class="card"><h3>Blockers</h3><ul class="list">${STATE.blockers.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>Scores</h3>${progress('Documentation',STATE.overview.documentation)}${progress('Risk inverse score',100-STATE.overview.risk)}<p class="muted">Risk score is elevated mainly by proof mismatch rather than by repo emptiness.</p></div></div>`,
 docs:()=>`<div class="card"><h3>Updated docs in this repo pass</h3><ul class="list"><li>README rewritten to match live repo + data truth.</li><li>DCC reset from “all complete” posture to evidence-aware readiness posture.</li><li>Workflow diagram replaced with one unified commercial flow.</li><li>Architecture doc corrected to distinguish strong architecture from incomplete proof.</li><li>Release readiness corrected to avoid overclaiming.</li><li>Buyer demo script updated to use live data honestly.</li><li>New demo data audit and repo cleanup docs added.</li></ul></div>`,
 prs:()=>`<div class="card"><h3>PR tracker</h3><table class="table"><tr><th>PR</th><th>Status</th><th>%</th><th>Note</th></tr>${STATE.prs.map(([n,s,p,d])=>`<tr><td>${n}</td><td><span class="pill ${pillClass(p)}">${s}</span></td><td>${p}%</td><td>${d}</td></tr>`).join('')}</table><div class="code" style="margin-top:16px">PR-29 remains part of the governed baseline and should continue to be referenced in tests and release-proof posture.
PR-30 is the current truth-reset pass.
PR-31 is the next product-proof pass.</div></div>`,
 roadmap:()=>`<div class="grid two"><div class="card"><h3>Roadmap</h3><table class="table"><tr><th>Priority</th><th>Action</th></tr>${STATE.roadmap.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table></div><div class="card"><h3>Cleanup</h3><ul class="list"><li>Delete one-off patch scripts from the root.</li><li>Archive old planning docs that compete with the DCC as active truth.</li><li>Keep one current README, one current architecture doc, one current workflow doc, and one current readiness doc.</li></ul></div></div>`
};
function renderSections(){const wrap=document.getElementById('sections');sections.forEach(([id],i)=>{const section=el('section',`section${i===0?' active':''}`,renderers[id]());section.id=id;wrap.appendChild(section)})}
function activate(id){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.target===id));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));const found=sections.find(([sid])=>sid===id);document.getElementById('pageTitle').textContent=found?found[1]:'Overview Dashboard'}
renderSidebar();renderSections();activate(location.hash.replace('#','')||'overview');window.addEventListener('hashchange',()=>activate(location.hash.replace('#','')||'overview'));document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a[data-target]');if(!a)return;e.preventDefault();history.replaceState(null,'','#'+a.dataset.target);activate(a.dataset.target)})
</script>
</body>
</html>
