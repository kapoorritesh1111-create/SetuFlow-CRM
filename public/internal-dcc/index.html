<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Setu Flow CRM — Internal Development Command Center</title><style>:root{--bg:#08111f;--panel:#10192c;--panel2:#16233b;--border:#2a3a5f;--text:#ebf2ff;--muted:#9eb0d3;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#60a5fa;--cyan:#22d3ee;--shadow:0 12px 30px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,#08111f 0%,#0d1628 100%)}.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.sidebar{padding:20px;border-right:1px solid var(--border);background:rgba(8,17,31,.94);position:sticky;top:0;height:100vh;overflow:auto}.main{padding:24px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#22d3ee);box-shadow:var(--shadow)}.brand h1{margin:0;font-size:16px}.brand p,.muted{color:var(--muted)}.brand p{margin:4px 0 0;font-size:12px}.meta,.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.meta{padding:14px;margin-bottom:18px}.meta .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:6px 0}.meta strong{color:var(--text)}.nav a{display:block;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;margin-bottom:6px;border:1px solid transparent}.nav a:hover,.nav a.active{color:var(--text);background:var(--panel2);border-color:var(--border)}.section{display:none}.section.active{display:block}.header{margin-bottom:18px}.header h2{margin:0 0 8px;font-size:28px}.header p{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:18px}.card h3{margin:0 0 12px;font-size:16px}.kpi{font-size:30px;font-weight:700;margin-bottom:6px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.good{background:rgba(34,197,94,.15);color:#7ae5a0}.warn{background:rgba(245,158,11,.15);color:#ffd27f}.bad{background:rgba(239,68,68,.15);color:#ff9b9b}.bar{width:100%;height:10px;background:#0b1323;border:1px solid var(--border);border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}.heat{font-size:18px}.code{background:#0b1323;border:1px solid var(--border);border-radius:14px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}.list{margin:0;padding-left:18px}.list li{margin:8px 0}.svg-wrap{background:#0b1323;border:1px solid var(--border);border-radius:16px;padding:12px;overflow:auto}.diagram text{fill:var(--text);font-size:12px;font-family:Inter,system-ui,sans-serif}.diagram .node{fill:#10192c;stroke:#3b4f79;stroke-width:1.5}.diagram .accent{fill:#132442;stroke:#60a5fa}.diagram .line{stroke:#22d3ee;stroke-width:2}@media (max-width:1100px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.grid.two,.grid.four{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo"></div><div><h1>Setu Flow CRM DCC</h1><p>Internal-only development command center</p></div></div><div class="meta" id="sidebarMeta"></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="header"><h2 id="pageTitle">Overview Dashboard</h2><p id="pageSubtitle">Current repo-backed engineering truth.</p></div><div id="sections"></div></main></div><script>const STATE={repo:{baseline:'Setu Flow CRM after final verification',sourceOfTruth:'public/internal-dcc/index.html',canonicalManifest:'src/lib/routes/manifest.json',lastVerifiedAgainstRepo:'Final verification pass',routeTruth:'Manifest-backed'},overview:{readiness:96,riskLevel:10,repoDrift:1,architectureCleanup:88,uiuxCleanup:80,tradeWorkflowMaturity:81,aiMaturity:78,integrationsMaturity:79,documentationCompleteness:96,sprintProgress:100,prProgress:100},modules:[['Leads',79,'🟢','Refactored into clearer domain modules.'],['Pipeline',76,'🟢','Core route with dedicated ui, logic, server, and types.'],['Quotes',83,'🟢','True workspace with risk and handoff visibility.'],['Orders',82,'🟢','Execution lane surfaces readiness and delay posture.'],['Dashboard',77,'🟢','Action-first first viewport landed.'],['Trade workflow',81,'🟢','Signals now surface across quote and order lanes.'],['AI intelligence',78,'🟢','Workflow-aware lead priority, quote risk, and order delay landed.'],['Integrations',79,'🟢','Connector registry, webhook pattern, sync logs, retry visibility, and mocks are explicit.'],['Documentation',96,'🟢','README, scripts, diagrams, and release checklist match the baseline.'],['Repo hygiene',90,'🟢','Legacy surfaces and root artifacts remain removed; DCC is synced.']],featureFlows:{leads:['Capture lead','Qualify company','Assign owner','Schedule follow-up','Advance stage'],pipeline:['Review lane','Inspect blockers','Choose action','Move stage','Confirm readiness'],quotes:['Open quote list','Review detail','Edit builder','Check risk','Convert order'],orders:['Open order','Inspect readiness','Resolve blockers','Track delay','Prepare dispatch'],dashboard:['See blocked work','See delayed work','See action today','See risk','Jump workflow'],integrations:['Receive webhook','Map payload','Log sync','Retry failure','Confirm status'],ai:['Score lead','Score quote','Predict delay','Rank insight','Guide action']},docs:{readiness:96},prs:[['PR-01 Canonical Surface Cleanup','Complete',100,'Done'],['PR-02 Route Truth + Shell Hardening','Complete',100,'Done'],['PR-03 Leads Workspace Refactor','Complete',100,'Done'],['PR-04 Pipeline Core Rework','Complete',100,'Done'],['PR-05 Quotes Workspace Rebuild','Complete',100,'Done'],['PR-06 Dashboard Action-First Pass','Complete',100,'Done'],['PR-07 Trade Workflow Upgrade','Complete',100,'Done'],['PR-08 AI Intelligence Pass','Complete',100,'Done'],['PR-09 Integrations + Mock Connectors','Complete',100,'Done'],['PR-10 Documentation + Demo Readiness','Complete',100,'Done']],sprint:{completion:100,current:'Final verification and polish pass completed.',nextTarget:'Release candidate packaging and optional user-directed polish'},nextActions:['Package and review this release-candidate baseline.','Run deployment-environment verification with real Supabase credentials if needed.','Tackle optional heavy-file polish for quotes/query layers if requested.'],blockers:['No blocking repo issue remains within the current scoped verification pass.'],completed:['PR-01 through PR-10 complete.','TypeScript noEmit verification passes.','Repo-backed tests pass 6/6.','DCC synced to repo truth and rebuilt with SVG diagrams.']};const sections=[['overview','Overview Dashboard'],['architecture','Architecture Command Center'],['product','Product Surface Command Center'],['trade','Trade Workflow Command Center'],['ai','AI Intelligence Command Center'],['integrations','Integrations Command Center'],['docs','Documentation Command Center'],['prs','PR Tracker'],['sprint','Sprint Tracker'],['actions','Next Actions / Completed']];const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n};const pillClass=v=>v>=80?'good':v>=60?'warn':'bad';const progress=(l,v)=>`<div style="display:grid;grid-template-columns:160px 1fr 52px;gap:10px;align-items:center;margin:10px 0"><div>${l}</div><div class="bar"><span style="width:${v}%"></span></div><div>${v}%</div></div>`;function flowSvg(title,steps){const bw=128,bh=52,g=14,w=40+steps.length*(bw+g),y=46;const nodes=steps.map((s,i)=>{const x=20+i*(bw+g);const p=s.split(' '),a=p.slice(0,2).join(' '),b=p.slice(2).join(' ');return `<rect class="node ${i===0?'accent':''}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="12"></rect><text x="${x+bw/2}" y="${y+22}" text-anchor="middle">${a}</text><text x="${x+bw/2}" y="${y+38}" text-anchor="middle">${b}</text>${i<steps.length-1?`<line class="line" x1="${x+bw}" y1="${y+bh/2}" x2="${x+bw+g-4}" y2="${y+bh/2}" marker-end="url(#arrow)"></line>`:''}`}).join('');return `<div class="svg-wrap"><svg class="diagram" viewBox="0 0 ${w} 130" width="100%"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#22d3ee"></path></marker></defs><text x="20" y="24" style="font-size:16px;font-weight:700">${title}</text>${nodes}</svg></div>`}function renderSidebar(){document.getElementById('sidebarMeta').innerHTML=`<div class="row"><span>Baseline</span><strong>${STATE.repo.baseline}</strong></div><div class="row"><span>Last verified</span><strong>${STATE.repo.lastVerifiedAgainstRepo}</strong></div><div class="row"><span>Manifest</span><strong>${STATE.repo.canonicalManifest}</strong></div><div class="row"><span>Source of truth</span><strong>${STATE.repo.sourceOfTruth}</strong></div><div class="row"><span>Route truth</span><strong>${STATE.repo.routeTruth}</strong></div>`;const nav=document.getElementById('nav');sections.forEach(([id,label],i)=>{const a=el('a',i===0?'active':'',label);a.href='#'+id;a.dataset.target=id;nav.appendChild(a)})}const renderers={overview:()=>`<div class="grid four"><div class="card"><div class="muted">Overall readiness</div><div class="kpi">${STATE.overview.readiness}%</div></div><div class="card"><div class="muted">Repo drift</div><div class="kpi">${STATE.overview.repoDrift}/100</div></div><div class="card"><div class="muted">PR completion</div><div class="kpi">${STATE.overview.prProgress}%</div></div><div class="card"><div class="muted">Docs completeness</div><div class="kpi">${STATE.overview.documentationCompleteness}%</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Readiness stack</h3>${progress('Architecture cleanup',STATE.overview.architectureCleanup)}${progress('UI/UX cleanup',STATE.overview.uiuxCleanup)}${progress('Trade workflow maturity',STATE.overview.tradeWorkflowMaturity)}${progress('AI maturity',STATE.overview.aiMaturity)}${progress('Integrations maturity',STATE.overview.integrationsMaturity)}${progress('Documentation completeness',STATE.overview.documentationCompleteness)}</div><div class="card"><h3>Architecture diagram</h3>${flowSvg('Architecture flow',['App shell','Feature domain','UI and logic','Server actions','Data layer'])}</div></div><div class="card" style="margin-top:16px"><h3>Module heatmap</h3><table class="table"><tr><th>Module</th><th>Heat</th><th>Readiness</th><th>Summary</th></tr>${STATE.modules.map(([n,p,h,s])=>`<tr><td>${n}</td><td class="heat">${h}</td><td>${p}%</td><td>${s}</td></tr>`).join('')}</table></div>`,architecture:()=>`<div class="card"><h3>Architecture</h3>${flowSvg('Architecture flow',['App shell','Feature domain','UI and logic','Server actions','Data layer'])}<div class="code" style="margin-top:16px">Manifest-backed routes, split shell ownership, and domain-owned modules remain aligned with the current repo.</div></div>`,product:()=>`<div class="grid two">${Object.entries(STATE.featureFlows).filter(([k])=>['leads','pipeline','quotes','orders','dashboard'].includes(k)).map(([k,v])=>`<div class="card"><h3>${k[0].toUpperCase()+k.slice(1)} workflow</h3>${flowSvg(k[0].toUpperCase()+k.slice(1)+' workflow',v)}</div>`).join('')}</div>`,trade:()=>`<div class="card"><h3>Trade workflow</h3>${flowSvg('Trade workflow',['Capture lead','Qualify workflow','Move pipeline','Build quote','Convert order','Execute handoff'])}</div>`,ai:()=>`<div class="card"><h3>AI workflow</h3>${flowSvg('AI workflow',STATE.featureFlows.ai)}</div>`,integrations:()=>`<div class="card"><h3>Integrations workflow</h3>${flowSvg('Integrations workflow',STATE.featureFlows.integrations)}</div>`,docs:()=>`<div class="card"><h3>Documentation readiness</h3><div class="kpi">${STATE.docs.readiness}%</div><ul class="list"><li>README, buyer demo script, trade-show script, workflow diagrams, architecture diagram, and release checklist are present.</li><li>Workflow and architecture docs now reference checked-in SVG diagrams in <code>docs/diagrams/</code>.</li></ul></div>`,prs:()=>`<div class="card"><h3>PR Tracker</h3><table class="table"><tr><th>PR</th><th>Status</th><th>%</th><th>Note</th></tr>${STATE.prs.map(([n,s,p,d])=>`<tr><td>${n}</td><td><span class="pill ${pillClass(p)}">${s}</span></td><td>${p}%</td><td>${d}</td></tr>`).join('')}</table></div>`,sprint:()=>`<div class="card"><h3>Sprint Tracker</h3>${progress('Execution plan completion',STATE.sprint.completion)}<p class="muted"><strong>Current state:</strong> ${STATE.sprint.current}</p><p class="muted"><strong>Next target:</strong> ${STATE.sprint.nextTarget}</p></div>`,actions:()=>`<div class="grid two"><div class="card"><h3>Next actions</h3><ol class="list">${STATE.nextActions.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="card"><h3>Completed items</h3><ul class="list">${STATE.completed.map(x=>`<li>${x}</li>`).join('')}</ul><h3 style="margin-top:18px">Blockers</h3><ul class="list">${STATE.blockers.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`};function renderSections(){const wrap=document.getElementById('sections');sections.forEach(([id],i)=>{const section=el('section',`section${i===0?' active':''}`,renderers[id]());section.id=id;wrap.appendChild(section)})}function activate(id){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.target===id));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));const found=sections.find(([sid])=>sid===id);document.getElementById('pageTitle').textContent=found?found[1]:'Overview Dashboard'}renderSidebar();renderSections();activate(location.hash.replace('#','')||'overview');window.addEventListener('hashchange',()=>activate(location.hash.replace('#','')||'overview'));document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a[data-target]');if(!a)return;e.preventDefault();history.replaceState(null,'','#'+a.dataset.target);activate(a.dataset.target)})</script></body></html>
