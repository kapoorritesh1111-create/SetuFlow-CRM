roadmap:()=>`<div class="grid two"><div class="card"><h3>Roadmap</h3><table class="table"><tr><th>Priority</th><th>Action</th></tr>${STATE.roadmap.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table><h3 style="margin-top:18px">Threshold program</h3><div class="code">Additional tracked PRs required to finish the threshold program: 0
Release-gate standard: keep release proof green and DCC/docs aligned</div></div><div class="card"><h3>Blockers</h3><ul class="list">${STATE.blockers.map(x=>`<li>${x}</li>`).join('')}</ul><h3 style="margin-top:18px">Risks</h3><ul class="list">${STATE.risks.map(x=>`<li>${x}</li>`).join('')}</ul><h3 style="margin-top:18px">Next actions</h3><ol class="list">${STATE.nextActions.map(x=>`<li>${x}</li>`).join('')}</ol><h3 style="margin-top:18px">Completed</h3><ul class="list">${STATE.completed.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`};
function renderSections(){const wrap=document.getElementById('sections');sections.forEach(([id],i)=>{const section=el('section',`section${i===0?' active':''}`,renderers[id]());section.id=id;wrap.appendChild(section)})}
function activate(id){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.target===id));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));const found=sections.find(([sid])=>sid===id);document.getElementById('pageTitle').textContent=found?found[1]:'Overview Dashboard'}
renderSidebar();renderSections();activate(location.hash.replace('#','')||'overview');window.addEventListener('hashchange',()=>activate(location.hash.replace('#','')||'overview'));document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a[data-target]');if(!a)return;e.preventDefault();history.replaceState(null,'','#'+a.dataset.target);activate(a.dataset.target)})
</script>
</body>
</html>
