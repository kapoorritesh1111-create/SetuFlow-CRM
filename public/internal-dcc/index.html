<!DOCTYPE html>

<style>
:root{--bg:#08111f;--panel:#10192c;--panel2:#16233b;--border:#2a3a5f;--text:#ebf2ff;--muted:#9eb0d3;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blue:#60a5fa;--cyan:#22d3ee;--shadow:0 12px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:linear-gradient(180deg,#08111f 0%,#0d1628 100%)}
.shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.sidebar{padding:20px;border-right:1px solid var(--border);background:rgba(8,17,31,.96);position:sticky;top:0;height:100vh;overflow:auto}.main{padding:24px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#22d3ee);box-shadow:var(--shadow)}.brand h1{margin:0;font-size:16px}.brand p,.muted{color:var(--muted)}.brand p{margin:4px 0 0;font-size:12px}
.meta,.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}.meta{padding:14px;margin-bottom:18px}.meta .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:6px 0}.meta strong{color:var(--text)}
.nav a{display:block;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;margin-bottom:6px;border:1px solid transparent}.nav a:hover,.nav a.active{color:var(--text);background:var(--panel2);border-color:var(--border)}
.section{display:none}.section.active{display:block}.header{margin-bottom:18px}.header h2{margin:0 0 8px;font-size:28px}.header p{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:18px}.card h3{margin:0 0 12px;font-size:16px}.kpi{font-size:30px;font-weight:700;margin-bottom:6px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.good{background:rgba(34,197,94,.15);color:#7ae5a0}.warn{background:rgba(245,158,11,.15);color:#ffd27f}.bad{background:rgba(239,68,68,.15);color:#ff9b9b}.bar{width:100%;height:10px;background:#0b1323;border:1px solid var(--border);border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}.heat{font-size:18px}.list{margin:0;padding-left:18px}.list li{margin:8px 0}.svg-wrap{background:#0b1323;border:1px solid var(--border);border-radius:16px;padding:12px;overflow:auto}.diagram text{fill:var(--text);font-size:12px;font-family:Inter,system-ui,sans-serif}.diagram .node{fill:#10192c;stroke:#3b4f79;stroke-width:1.5}.diagram .accent{fill:#132442;stroke:#60a5fa}.diagram .warnNode{fill:#2d2210;stroke:#d97706}.diagram .badNode{fill:#341616;stroke:#ef4444}.diagram .line{stroke:#22d3ee;stroke-width:2}.banner{padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,#132442,#10192c);margin-bottom:16px}.banner strong{display:block;margin-bottom:8px}.code{background:#0b1323;border:1px solid var(--border);border-radius:14px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
@media (max-width:1100px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}}
</style>
</head>
<body>

prs:[['PR-01 Canonical Surface Cleanup','Complete',100,'Done'],['PR-02 Route Truth + Shell Hardening','Complete',100,'Done'],['PR-03 Leads Workspace Refactor','Complete',100,'Done'],['PR-04 Pipeline Core Rework','Complete',100,'Done'],['PR-05 Quotes Workspace Rebuild','Complete',100,'Done'],['PR-06 Dashboard Action-First Pass','Complete',100,'Done'],['PR-07 Trade Workflow Upgrade','Complete',100,'Done'],['PR-08 AI Intelligence Pass','Complete',100,'Done'],['PR-09 Integrations + Mock Connectors','Complete',100,'Done'],['PR-10 Documentation + Demo Readiness','Complete',100,'Done'],['PR-11 Admin Product Management System of Record','Complete',100,'Admin route, navigation, governance framing, and DCC truth aligned.'],['PR-12 Leads → Product/Category Commercial Bridge','Complete',100,'Lead coverage copy and gating now frame product/category interest as the quote bridge.'],['PR-13 Quotes → Product Catalog Integration Hardening','Complete',100,'Catalog-led quote language tightened while preserving override reason and approval gates exactly as-is.'],['PR-14 Orders → Confirmed Quote Line Continuity','Complete',100,'Orders now read confirmed contract line continuity with baseline versus final pricing posture visible.'],['PR-15 Product Management → Trade Attribute Persistence','Complete',100,'Admin product management now persists origin, export, packaging, shipment, and UOM metadata through governed variant payloads.'],['PR-16 Leads → Interest State Hardening','Complete',100,'Lead coverage now distinguishes category-only interest from confirmed product interest and carries that state downstream.'],['PR-17 Quotes → Rich Product Continuity Snapshot','Complete',100,'Quote lines now preserve richer continuity notes derived from governed product metadata while keeping override controls unchanged.'],['PR-18 Orders → Execution Readiness Enrichment','Complete',100,'Orders now expose origin, packaging, export, and shipment-relevant context on confirmed lines for handoff readiness.'],['PR-19 Product Schema Promotion + Admin Governance Hardening','Complete',100,'Structured product-variant trade fields now exist in the repo migration/types and Admin reads/writes them with backward-compatible payload fallback.'],['PR-20 Leads + Contact Exchange Continuity Unification','Complete',100,'Lead interest, contact exchange context, and product/category linkage now resolve through one workflow-backed continuity model across Leads, Quote entry, and Pipeline.'],['PR-21 Pipeline Business-Gating + Readiness Enforcement','Complete',100,'Pipeline stage movement now blocks on qualification, confirmed product linkage, market coverage, pricing readiness, compliance posture, and overdue follow-up drift, with explicit blocker/action surfaces in Pipeline and the lead command center.'],['PR-22 Quotes → Contract Locking + Approved Commercial Continuity','Complete',100,'Accepted quotes now sync contract-grade commercial lock snapshots and line continuity into Contracts without changing override logic.'],['PR-23 Orders → Execution State Machine + Blocker Progression','Complete',100,'Orders now progress through explicit draft, ready, released, dispatched, and completed posture with visible blocker and action guidance.'],['PR-24 Compliance Documents + Dispatch Artifact Orchestration','Planned',0,'Tie required documents, compliance artifacts, and dispatch preparation directly to confirmed order lines.'],['PR-25 Dashboard Evidence Center + Action Forcing','Planned',0,'Raise dashboard readiness with blocker visibility, operator decisions, and threshold-grade action evidence.'],['PR-26 AI Operational Governance + Decision Controls','Planned',0,'Move AI from advisory scoring toward governed operational recommendations and explicit control boundaries.'],['PR-27 Integration Production Hardening + Bidirectional Sync','Planned',0,'Replace mock-grade assumptions with production-grade validation, retries, status visibility, and bidirectional continuity.'],['PR-28 Documentation / DCC / SOP Completion Pack','Planned',0,'Finish release-grade DCC accuracy, SOPs, runbooks, and module-level threshold evidence.'],['PR-29 Repo Release-Gate + Hygiene Hardening','Planned',0,'Complete test, quality, packaging, and release-gate hardening needed to hold the 98% pass threshold.']],

blockers:['6 additional PRs are still required to move every tracked module to the 98% pass threshold.','Dashboard, AI, Integrations, compliance-document orchestration, and dispatch artifact completion remain the largest readiness deltas.','Override approval logic must remain untouched while the remaining threshold work completes.'],
risks:['A future pass could accidentally weaken override-governance while expanding compliance and dispatch automation.','If product or contact continuity is duplicated outside the governed workflow, stage-gating drift can return.','Execution UX can still look complete before compliance documents and dispatch artifacts are orchestrated together.'],

const sections=[['overview','Overview Dashboard'],['architecture','Architecture Command Center'],['product','Product Surface Command Center'],['workflow','Canonical Workflow'],['trade','Trade Workflow Command Center'],['docs','Documentation Command Center'],['prs','PR Tracker'],['sprint','Sprint Tracker'],['roadmap','Roadmap / Risks / Next Actions']];
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n};
const pillClass=v=>v>=80?'good':v>=60?'warn':'bad';
const progress=(l,v)=>`<div style="display:grid;grid-template-columns:180px 1fr 52px;gap:10px;align-items:center;margin:10px 0"><div>${l}</div><div class="bar"><span style="width:${v}%"></span></div><div>${v}%</div></div>`;
function flowSvg(title,steps,highlight=2){const bw=150,bh=56,g=16,w=40+steps.length*(bw+g),y=48;const nodes=steps.map((s,i)=>{const x=20+i*(bw+g);const words=s.split(' ');const a=words.slice(0,2).join(' ');const b=words.slice(2).join(' ');const klass=i===highlight?'warnNode':(i===0?'accent':'node');return `<rect class="${klass}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="14"></rect><text x="${x+bw/2}" y="${y+22}" text-anchor="middle">${a}</text><text x="${x+bw/2}" y="${y+40}" text-anchor="middle">${b}</text>${i<steps.length-1?`<line class="line" x1="${x+bw}" y1="${y+bh/2}" x2="${x+bw+g-4}" y2="${y+bh/2}" marker-end="url(#arrow)"></line>`:''}`}).join('');return `<div class="svg-wrap"><svg class="diagram" viewBox="0 0 ${w} 146" width="100%"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#22d3ee"></path></marker></defs><text x="20" y="24" style="font-size:16px;font-weight:700">${title}</text>${nodes}</svg></div>`}
function renderSidebar(){document.getElementById('sidebarMeta').innerHTML=`<div class="row"><span>Baseline</span><strong>${STATE.repo.baseline}</strong></div><div class="row"><span>Last verified</span><strong>${STATE.repo.lastVerifiedAgainstRepo}</strong></div><div class="row"><span>Manifest</span><strong>${STATE.repo.canonicalManifest}</strong></div><div class="row"><span>Source of truth</span><strong>${STATE.repo.sourceOfTruth}</strong></div><div class="row"><span>Route truth</span><strong>${STATE.repo.routeTruth}</strong></div>`;const nav=document.getElementById('nav');sections.forEach(([id,label],i)=>{const a=el('a',i===0?'active':'',label);a.href='#'+id;a.dataset.target=id;nav.appendChild(a)})}
const renderers={
overview:()=>`<div class="banner"><strong>Corrected product assumptions now drive this DCC.</strong><ul class="list">${STATE.assumptions.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="grid four"><div class="card"><div class="muted">Overall readiness</div><div class="kpi">${STATE.overview.readiness}%</div></div><div class="card"><div class="muted">Repo drift</div><div class="kpi">${STATE.overview.repoDrift}/100</div></div><div class="card"><div class="muted">Risk level</div><div class="kpi">${STATE.overview.riskLevel}%</div></div><div class="card"><div class="muted">PR completion</div><div class="kpi">${STATE.overview.prProgress}%</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Readiness stack</h3>${progress('Architecture cleanup',STATE.overview.architectureCleanup)}${progress('UI/UX cleanup',STATE.overview.uiuxCleanup)}${progress('Trade workflow maturity',STATE.overview.tradeWorkflowMaturity)}${progress('AI maturity',STATE.overview.aiMaturity)}${progress('Integrations maturity',STATE.overview.integrationsMaturity)}${progress('Documentation completeness',STATE.overview.documentationCompleteness)}</div><div class="card"><h3>Current operating truth</h3><ul class="list"><li>Admin now owns Product Management as the governing catalog surface.</li><li>Leads now preserve category-only versus confirmed-product interest as explicit downstream commercial state.</li><li>Quote override and approval logic remains intact while richer product continuity metadata now flows into quote and order execution views.</li><li><strong>Threshold plan:</strong> 6 additional PRs, each 100% complete, are still required to move every tracked module to at least 98% readiness.</li></ul></div></div><div class="card" style="margin-top:16px"><h3>Module heatmap</h3><table class="table"><tr><th>Module</th><th>Heat</th><th>Readiness</th><th>Summary</th></tr>${STATE.modules.map(([n,p,h,s])=>`<tr><td>${n}</td><td class="heat">${h}</td><td>${p}%</td><td>${s}</td></tr>`).join('')}</table></div>`,
architecture:()=>`<div class="grid two"><div class="card"><h3>Architecture posture</h3>${flowSvg('System architecture',['App shell','Feature domains','UI and logic','Server actions','Data layer'])}<div class="code" style="margin-top:16px">The repo remains structurally clean. The current architectural posture now supports structured product-variant trade fields with backward-compatible payload fallback, so Admin remains the only product source of truth while legacy records still hydrate cleanly.</div></div><div class="card"><h3>File-level hotspots to revisit</h3><ul class="list"><li>src/app/(app)/products/page.tsx</li><li>src/features/products/components/products-spreadsheet-page.tsx</li><li>src/features/products/server/actions.ts</li><li>src/app/(app)/quotes/page.tsx</li><li>src/features/quotes/components/quote-wizard-form.tsx</li><li>src/app/(app)/orders/page.tsx</li><li>src/app/(app)/admin/*</li></ul></div></div>`,
product:()=>`<div class="card"><h3>Core module readiness</h3><div class="muted" style="margin-bottom:10px">Pass threshold moving forward: every tracked module must reach at least 98%, and every remaining PR must be 100% complete.</div><table class="table"><tr><th>Module</th><th>Current</th><th>What 100% means</th><th>Primary gap</th></tr>${[
['Leads','92%','Lead capture persists category-only versus confirmed-product interest as structured commercial state.','Pipeline enforcement and release-grade gating still remain.'],
['Quotes','95%','Quotes are catalog-led, support approved price overrides, and now sync approved commercial terms into contract-grade snapshots without weakening override governance.','Contract lock is now in place; contract-to-execution statework still remains.'],
['Orders','95%','Orders consume confirmed quote lines, preserve contract-grade commercial continuity, and now progress through explicit execution state transitions.','Compliance documents and dispatch artifacts still remain for the 98% gate.'],
['Settings/Admin','92%','Admin owns product catalog, categories, UOM, trade attributes, base pricing, and override policy framing.','Release governance and downstream execution controls still remain for the 98% gate.'],
['Product management','94%','System of record for commercial catalog behavior with structured trade fields and payload-safe fallback.','Execution automation and release hardening still remain.']
].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>`,
workflow:()=>`<div class="grid two"><div class="card"><h3>Canonical commercial workflow</h3>${flowSvg('Lead -> Product -> Quote -> Order -> Execution',STATE.workflow.canonical,1)}</div><div class="card"><h3>Repo gaps against workflow</h3><table class="table"><tr><th>Gap</th><th>Reality</th></tr>${STATE.gaps.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table></div></div><div class="grid two" style="margin-top:16px">${Object.entries(STATE.workflow.featureFlows).map(([k,v])=>`<div class="card"><h3>${k[0].toUpperCase()+k.slice(1)} flow</h3>${flowSvg(k[0].toUpperCase()+k.slice(1)+' workflow',v,k==='quotes'?2:1)}</div>`).join('')}</div>`,
trade:()=>`<div class="grid two"><div class="card"><h3>Trade workflow status</h3>${progress('Trade workflow maturity',STATE.overview.tradeWorkflowMaturity)}<ul class="list"><li>Incoterm, freight readiness, compliance blockers, dispatch readiness, and handoff signals are visible.</li><li>Orders now expose confirmed commercial lines plus governed execution posture so operators can advance from draft to completion with visible blockers.</li><li>Next workflow work should focus on shipment-task automation rather than re-litigating quote continuity.</li></ul></div><div class="card"><h3>Override approval truth</h3><ul class="list"><li>Catalog base price is mandatory as the commercial default.</li><li>Quote line price override is allowed.</li><li>Override reason is required.</li><li>Approval-gated override posture remains preserved exactly as-is.</li></ul></div></div>`,
docs:()=>`<div class="card"><h3>Documentation posture</h3><div class="kpi">${STATE.overview.documentationCompleteness}%</div><ul class="list"><li>Docs remain strong.</li><li>The DCC now reflects execution truth through PR-23 rather than only threshold planning.</li><li>The remaining documentation program is still PR-28: DCC accuracy, SOPs, runbooks, and release evidence needed to help Documentation / DCC reach and hold 98%.</li></ul></div>`,
prs:()=>`<div class="card"><h3>PR Tracker</h3><table class="table"><tr><th>PR</th><th>Status</th><th>%</th><th>Note</th></tr>${STATE.prs.map(([n,s,p,d])=>`<tr><td>${n}</td><td><span class="pill ${pillClass(p)}">${s}</span></td><td>${p}%</td><td>${d}</td></tr>`).join('')}</table></div>`,
sprint:()=>`<div class="card"><h3>Sprint Tracker</h3>${progress('Execution plan completion',STATE.sprint.completion)}<p class="muted"><strong>Current state:</strong> ${STATE.sprint.current}</p><p class="muted"><strong>Next target:</strong> ${STATE.sprint.nextTarget}</p></div>`,
roadmap:()=>`<div class="grid two"><div class="card"><h3>Roadmap</h3><table class="table"><tr><th>Priority</th><th>Action</th></tr>${STATE.roadmap.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table><h3 style="margin-top:18px">Threshold program</h3><div class="code">Remaining PRs required to reach 98% across all tracked modules: 6
Required completion standard for each remaining PR: 100%</div></div><div class="card"><h3>Blockers</h3><ul class="list">${STATE.blockers.map(x=>`<li>${x}</li>`).join('')}</ul><h3 style="margin-top:18px">Risks</h3><ul class="list">${STATE.risks.map(x=>`<li>${x}</li>`).join('')}</ul><h3 style="margin-top:18px">Next actions</h3><ol class="list">${STATE.nextActions.map(x=>`<li>${x}</li>`).join('')}</ol><h3 style="margin-top:18px">Completed</h3><ul class="list">${STATE.completed.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`};
function renderSections(){const wrap=document.getElementById('sections');sections.forEach(([id],i)=>{const section=el('section',`section${i===0?' active':''}`,renderers[id]());section.id=id;wrap.appendChild(section)})}
function activate(id){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.target===id));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));const found=sections.find(([sid])=>sid===id);document.getElementById('pageTitle').textContent=found?found[1]:'Overview Dashboard'}
renderSidebar();renderSections();activate(location.hash.replace('#','')||'overview');window.addEventListener('hashchange',()=>activate(location.hash.replace('#','')||'overview'));document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a[data-target]');if(!a)return;e.preventDefault();history.replaceState(null,'','#'+a.dataset.target);activate(a.dataset.target)})
</script>
