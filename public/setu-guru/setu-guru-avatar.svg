# UPDATING THE CHATBOT (MAINTENANCE GUIDE)

## When to Update
- New feature is shipped
- User reports wrong answer
- Workflow changes
- New admin capability added

## How to Update
1. Edit the relevant section in `SETUFLOW_KNOWLEDGE_BASE.md`
2. Add new Q&A pairs to Section 23 (Common Questions)
3. Update the Glossary if new terms introduced
4. Add to "What's New" section
5. Re-upload the file to the GPT Knowledge section
6. Test 3-5 questions to verify the update works

## Versioning Convention
Add a timestamp to updates: `_Updated: [Month Year]_`

