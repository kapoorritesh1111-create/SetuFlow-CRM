# GPT CONFIGURATION INSTRUCTIONS

## Step 1 — Create a New GPT
1. Go to https://chat.openai.com/gpts
2. Click **"Create a GPT"**
3. Click **"Configure"** tab (not the Builder chat)

## Step 2 — Set the Name and Description
- **Name:** Setu Guru
- **Description:** Your SetuFlow CRM guide — The Bridge Master. I bridge the gap between you and everything in your CRM.

## Step 2b — Upload the Profile Image
- Upload `setu_guru_avatar.svg` (or PNG export) as the GPT profile picture
- To convert to PNG: open SVG in Chrome → right-click → "Save image as PNG"
- Or convert free at: https://cloudconvert.com/svg-to-png

## Step 3 — Paste the System Prompt
- Copy everything between ===BEGIN SYSTEM PROMPT=== and ===END SYSTEM PROMPT===
- Paste it into the **"Instructions"** field

## Step 4 — Set Conversation Starters
Add these starter prompts:
1. "How do I create a quote for a buyer?"
2. "What roles can send quotes?"
3. "How do I set up a new organization?"
4. "My order is stuck in Draft — how do I fix it?"
5. "How does the pricing calculator work?"
6. "How do I import products from a CSV?"

## Step 5 — Upload Knowledge Files
In the **"Knowledge"** section, upload ALL of these files:
- `SETUFLOW_KNOWLEDGE_BASE.md` ← Main knowledge document
- `SETUFLOW_WORKFLOWS.md` ← Step-by-step workflow guides
- `SETUFLOW_TROUBLESHOOTING.md` ← Error and blocker resolution
- `SETUFLOW_ONBOARDING_GUIDE.md` ← New org setup guide
- Any workflow diagram images (PNG/SVG)

## Step 6 — Configure Capabilities
- ✅ Web Browsing: OFF (knowledge is in uploaded files)
- ✅ DALL-E: OFF
- ✅ Code Interpreter: OFF (unless you want it to help with imports)

## Step 7 — Set Audience
- Profile visibility: Only people with the link (for internal use)
- Or: Anyone (for public-facing support)

## Step 8 — Making it Learn Over Time

### Method A: Manual Updates
When users ask questions the bot can't answer well:
1. Note the question
2. Add the answer to the relevant knowledge file
3. Re-upload the updated file to the GPT

### Method B: Feedback Collection
Add this to conversation starters: "Report a missing answer"
When user clicks it, the bot collects:
- The question that wasn't answered well
- The correct answer (if user knows it)
- Screenshot/context

You then review collected feedback monthly and update knowledge files.

### Method C: GPT Actions (Advanced)
Connect a Google Sheet as an Action endpoint:
- Bot logs unanswered questions to the sheet automatically
- You review weekly and update knowledge base
- Re-upload updated files

## Step 9 — Test Before Launch
Test these scenarios:
1. "How do I create my first quote?" → Should give full 6-step workflow
2. "Why can't my sales team member approve quotes?" → Should explain 15% threshold + approval roles
3. "Where is the pricing calculator?" → Should give exact route
4. "We're a new company, how do we get started?" → Should give full onboarding sequence
5. "Can the AI send a quote for me?" → Should say NO and explain AI guardrail

