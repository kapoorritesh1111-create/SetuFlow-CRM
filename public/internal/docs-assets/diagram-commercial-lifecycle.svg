<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Commercial lifecycle diagram">
  <defs>
    <linearGradient id="gradA" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#112847" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="540" rx="34" fill="#f5f9fe"/>
  <text x="54" y="70" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#10233a">SETU Flow commercial lifecycle</text>
  <text x="54" y="102" font-family="Inter, sans-serif" font-size="16" fill="#5b738f">A disciplined commercial flow from initial signal to final payment confirmation</text>
  <path d="M116 286 H1080" fill="none" stroke="#c7d7ea" stroke-width="8" stroke-linecap="round"/>
  <circle cx="160" cy="286" r="14" fill="#2563eb"/>
  <circle cx="338" cy="286" r="14" fill="#2d78ea"/>
  <circle cx="516" cy="286" r="14" fill="#3790e2"/>
  <circle cx="694" cy="286" r="14" fill="#2daab4"/>
  <circle cx="872" cy="286" r="14" fill="#1ab693"/>
  <circle cx="1050" cy="286" r="14" fill="#14b8a6"/>
  
  <g filter="url(#shadow)">
    <rect x="72" y="144" width="176" height="112" rx="24" fill="#ffffff" stroke="#d8e5f3"/>
    <rect x="250" y="342" width="176" height="112" rx="24" fill="#ffffff" stroke="#d8e5f3"/>
    <rect x="428" y="144" width="176" height="112" rx="24" fill="#ffffff" stroke="#d8e5f3"/>
    <rect x="606" y="342" width="176" height="112" rx="24" fill="#ffffff" stroke="#d8e5f3"/>
    <rect x="784" y="144" width="176" height="112" rx="24" fill="#ffffff" stroke="#d8e5f3"/>
    <rect x="962" y="342" width="176" height="112" rx="24" fill="#ffffff" stroke="#d8e5f3"/>
  </g>
  
  <g font-family="Inter, sans-serif" fill="#10233a">
    <text x="94" y="180" font-size="12" font-weight="700" letter-spacing="1.3" fill="#2b6be2">01 · CAPTURE</text>
    <text x="94" y="212" font-size="22" font-weight="800">Lead signal</text>
    <text x="94" y="238" font-size="14" fill="#5b738f">Manual intake, public forms, card scan,</text>
    <text x="94" y="257" font-size="14" fill="#5b738f">smart vCard and trade events.</text>

    <text x="272" y="378" font-size="12" font-weight="700" letter-spacing="1.3" fill="#2b6be2">02 · QUALIFY</text>
    <text x="272" y="410" font-size="22" font-weight="800">Structure demand</text>
    <text x="272" y="436" font-size="14" fill="#5b738f">Coverage, next action, product intent</text>
    <text x="272" y="455" font-size="14" fill="#5b738f">and commercial readiness.</text>

    <text x="450" y="180" font-size="12" font-weight="700" letter-spacing="1.3" fill="#2b6be2">03 · QUOTE</text>
    <text x="450" y="212" font-size="22" font-weight="800">Version intent</text>
    <text x="450" y="238" font-size="14" fill="#5b738f">Pricing basis, approvals, compliance</text>
    <text x="450" y="257" font-size="14" fill="#5b738f">and tracked send control.</text>

    <text x="628" y="378" font-size="12" font-weight="700" letter-spacing="1.3" fill="#118c83">04 · ACCEPT</text>
    <text x="628" y="410" font-size="22" font-weight="800">Confirm buyer intent</text>
    <text x="628" y="436" font-size="14" fill="#5b738f">Accepted quote version becomes the</text>
    <text x="628" y="455" font-size="14" fill="#5b738f">basis for execution.</text>

    <text x="806" y="180" font-size="12" font-weight="700" letter-spacing="1.3" fill="#118c83">05 · EXECUTE</text>
    <text x="806" y="212" font-size="22" font-weight="800">Run the order</text>
    <text x="806" y="238" font-size="14" fill="#5b738f">Actual lines, documents, dispatch,</text>
    <text x="806" y="257" font-size="14" fill="#5b738f">delivery and finance stages.</text>

    <text x="984" y="378" font-size="12" font-weight="700" letter-spacing="1.3" fill="#118c83">06 · CLOSE</text>
    <text x="984" y="410" font-size="22" font-weight="800">Reconcile & close</text>
    <text x="984" y="436" font-size="14" fill="#5b738f">Invoice, payment and formal</text>
    <text x="984" y="455" font-size="14" fill="#5b738f">operational closeout.</text>
  </g>
  
  <rect x="72" y="472" width="1066" height="28" rx="14" fill="url(#gradA)" opacity="0.16"/>
  <text x="98" y="490" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f5367">Quote send is gated • Accepted versions anchor orders • Documents and payments complete the lifecycle</text>
</svg>
