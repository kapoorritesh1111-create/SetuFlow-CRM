<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-label="Mobile capture flow diagram">
  <defs>
    <linearGradient id="mgrad" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  </defs>
  <rect width="860" height="520" rx="26" fill="#f7fbff"/>
  <text x="40" y="58" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#10233a">Mobile capture & smart contact flow</text>
  <text x="40" y="88" font-family="Inter, sans-serif" font-size="15" fill="#5b738f">Trade-show and field experiences feed directly into structured CRM actions.</text>
  <rect x="54" y="122" width="174" height="290" rx="30" fill="#10233a"/>
  <rect x="70" y="154" width="142" height="206" rx="16" fill="#ffffff"/>
  <rect x="88" y="176" width="106" height="16" rx="8" fill="#e5eef7"/>
  <rect x="88" y="208" width="106" height="82" rx="14" fill="url(#mgrad)" opacity="0.16"/>
  <rect x="88" y="306" width="48" height="32" rx="10" fill="#eff4fb"/>
  <rect x="146" y="306" width="48" height="32" rx="10" fill="#eff4fb"/>
  <text x="98" y="235" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10233a">Scan card</text>
  <text x="98" y="255" font-family="Inter, sans-serif" font-size="13" fill="#5b738f">or share vCard</text>
  <text x="92" y="386" font-family="Inter, sans-serif" font-size="13" fill="#d7e4f3">Mobile workspace</text>

  <g font-family="Inter, sans-serif">
    <rect x="292" y="152" width="210" height="78" rx="22" fill="#ffffff" stroke="#d8e5f3"/>
    <text x="320" y="184" font-size="14" font-weight="700" fill="#2563eb">Capture & extract</text>
    <text x="320" y="210" font-size="14" fill="#5b738f">Vision parse, contact normalization</text>

    <rect x="292" y="258" width="210" height="78" rx="22" fill="#ffffff" stroke="#d8e5f3"/>
    <text x="320" y="290" font-size="14" font-weight="700" fill="#2563eb">Lead creation / enrichment</text>
    <text x="320" y="316" font-size="14" fill="#5b738f">Map to account, source and next action</text>

    <rect x="292" y="364" width="210" height="78" rx="22" fill="#ffffff" stroke="#d8e5f3"/>
    <text x="320" y="396" font-size="14" font-weight="700" fill="#2563eb">Sales workflow continuity</text>
    <text x="320" y="422" font-size="14" fill="#5b738f">Follow-up, coverage and quote path</text>

    <rect x="574" y="152" width="228" height="132" rx="24" fill="#0d1f37"/>
    <text x="602" y="188" font-size="14" font-weight="700" fill="#79fff4">Smart vCard path</text>
    <text x="602" y="214" font-size="14" fill="#c0cede">Controlled contact sharing</text>
    <text x="602" y="238" font-size="14" fill="#c0cede">Wallet / page entry</text>
    <text x="602" y="262" font-size="14" fill="#c0cede">CRM-aware destination</text>

    <rect x="574" y="314" width="228" height="128" rx="24" fill="#ffffff" stroke="#d8e5f3"/>
    <text x="602" y="350" font-size="14" font-weight="700" fill="#0d8b81">Result</text>
    <text x="602" y="376" font-size="14" fill="#5b738f">Field interaction becomes structured CRM data</text>
    <text x="602" y="398" font-size="14" fill="#5b738f">instead of a disconnected manual follow-up</text>
  </g>

  <path d="M229 266 H278" fill="none" stroke="#9eb6d3" stroke-width="4" stroke-linecap="round"/>
  <path d="M503 191 H548" fill="none" stroke="#9eb6d3" stroke-width="4" stroke-linecap="round"/>
  <path d="M503 300 H548" fill="none" stroke="#9eb6d3" stroke-width="4" stroke-linecap="round"/>
  <path d="M398 230 V257" fill="none" stroke="#9eb6d3" stroke-width="4" stroke-linecap="round"/>
  <path d="M398 336 V363" fill="none" stroke="#9eb6d3" stroke-width="4" stroke-linecap="round"/>
</svg>
