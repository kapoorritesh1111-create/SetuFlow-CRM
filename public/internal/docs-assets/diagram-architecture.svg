  <text x="798" y="245" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f8fbff">Internal docs, roadmap and issue tracker</text>

  <rect x="74" y="322" width="338" height="140" rx="26" fill="#f7fbff" stroke="#d8e5f3"/>
