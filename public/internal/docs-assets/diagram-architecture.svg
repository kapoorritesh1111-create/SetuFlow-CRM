  <text x="810" y="388" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#10233a">Auth, org scope & permission normalization</text>
  <text x="810" y="420" font-family="Inter, sans-serif" font-size="15" fill="#5b738f">Organisation context, roles, route guards, internal shared-doc protection</text>
  <rect x="810" y="436" width="286" height="10" rx="5" fill="#e1ebf7"/>
  <rect x="810" y="436" width="220" height="10" rx="5" fill="url(#blue)"/>

  <rect x="74" y="520" width="480" height="158" rx="26" fill="#0d1f37"/>
  <text x="102" y="556" font-family="Inter, sans-serif" font-size="15" letter-spacing="1.5" font-weight="700" fill="#79fff4">SUPABASE PLATFORM</text>
  <text x="102" y="588" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Persistence, auth and storage</text>
  <text x="102" y="620" font-family="Inter, sans-serif" font-size="15" fill="#b7c8da">profiles · organizations · leads · quotes · orders · audit artifacts · docs screenshots</text>
  <rect x="102" y="640" width="420" height="10" rx="5" fill="#27496f"/>
  <rect x="102" y="640" width="320" height="10" rx="5" fill="#22d3ee"/>

  <rect x="584" y="520" width="542" height="158" rx="26" fill="#ffffff" stroke="#d8e5f3"/>
  <text x="612" y="556" font-family="Inter, sans-serif" font-size="15" letter-spacing="1.5" font-weight="700" fill="#7c5cff">EXTERNAL SERVICES</text>
  <text x="612" y="588" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#10233a">OpenAI, mail, files and partner systems</text>
  <text x="612" y="622" font-family="Inter, sans-serif" font-size="15" fill="#5b738f">Setu Guru model calls, business card OCR / vision, mail and PDF delivery, webhook targets</text>
  <rect x="612" y="640" width="470" height="10" rx="5" fill="#e1ebf7"/>
  <rect x="612" y="640" width="250" height="10" rx="5" fill="#8b5cf6"/>

