  <text x="98" y="388" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#10233a">UI, route groups & page composition</text>
  <text x="98" y="420" font-family="Inter, sans-serif" font-size="15" fill="#5b738f">Dashboard, leads, pipeline, quotes, orders, admin, mobile, docs workspace</text>
  <rect x="98" y="436" width="286" height="10" rx="5" fill="#e1ebf7"/>
  <rect x="98" y="436" width="192" height="10" rx="5" fill="url(#blue)"/>

  <rect x="430" y="322" width="338" height="140" rx="26" fill="#f7fbff" stroke="#d8e5f3"/>
  <text x="454" y="356" font-family="Inter, sans-serif" font-size="15" letter-spacing="1.5" font-weight="700" fill="#156a8f">SERVER ACTIONS & APIS</text>
  <text x="454" y="388" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#10233a">Workflow logic, PDFs, AI & integrations</text>
  <text x="454" y="420" font-family="Inter, sans-serif" font-size="15" fill="#5b738f">Quotes, orders, compliance, card scan, Setu Guru, webhooks, internal docs helpers</text>
  <rect x="454" y="436" width="286" height="10" rx="5" fill="#e1ebf7"/>
  <rect x="454" y="436" width="236" height="10" rx="5" fill="url(#blue)"/>

