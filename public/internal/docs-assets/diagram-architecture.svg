  <text x="74" y="122" font-family="Inter, sans-serif" font-size="16" fill="#5b738f">Premium documentation diagram — application, services and data boundaries</text>

  <rect x="74" y="166" width="1052" height="118" rx="28" fill="#0b1a2e"/>
  <text x="104" y="204" font-family="Inter, sans-serif" font-size="15" letter-spacing="1.5" font-weight="700" fill="#77a8ff">USER SURFACES</text>
  <rect x="104" y="220" width="210" height="40" rx="14" fill="#132944" stroke="#27496f"/>
  <text x="124" y="245" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f8fbff">Internal workspace</text>
  <rect x="328" y="220" width="210" height="40" rx="14" fill="#132944" stroke="#27496f"/>
  <text x="350" y="245" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f8fbff">Mobile capture routes</text>
  <rect x="552" y="220" width="210" height="40" rx="14" fill="#132944" stroke="#27496f"/>
  <text x="575" y="245" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#f8fbff">Public / shared surfaces</text>
