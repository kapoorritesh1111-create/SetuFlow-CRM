<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>SETU Flow | Premium Mobile Experience</title><style>*{box-sizing:border-box}body{margin:0;background:#e9efed;color:#15312d;font:15px -apple-system,BlinkMacSystemFont,Arial}.app{background:white;max-width:430px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(94px + env(safe-area-inset-bottom))}header{height:65px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4ece9}.logo{background:#076e60;color:white;border-radius:12px;padding:10px;font-weight:bold}.brand{display:flex;align-items:center;gap:9px}.small{font-size:12px;color:#70827e}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#087364;color:white;font-weight:700}.secondary{background:#eaf3f0;color:#0a6e60}.outline{background:#fff;color:#19574e;border:1px solid #d6e3de}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#f1f6f4;border-radius:14px;padding:15px}.tile strong{font-size:23px;display:block}.card{border:1px solid #e3ebe7;border-radius:14px;padding:15px;margin:10px 0}.muted{color:#6d807a;font-size:13px}h1{font-size:23px;margin:23px 0 4px}h3{font-size:15px;margin:22px 0 12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.actions button{background:#f0f5f3;color:#195e54;padding:12px 2px;font-size:11px}.actions b{display:block;font-size:22px;margin-bottom:7px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:white;border-top:1px solid #e4ece9;display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}.nav button{background:white;color:#5e736e;font-size:11px;padding:6px}.nav button b{display:block;font-size:20px}.nav button.on{color:#087364}.fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - 390px)/2));border-radius:17px;font-size:24px;box-shadow:0 4px 18px #074d4144}.overlay{position:fixed;inset:0;background:#143d3688;display:flex;align-items:end;justify-content:center}.panel{max-width:430px;width:100%;background:white;border-radius:22px 22px 0 0;padding:20px 18px calc(30px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.hide{display:none}label{display:block;font-weight:700;font-size:12px;color:#55716a;margin:15px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d7e5df;border-radius:12px}.full{width:100%;margin-top:12px}.camera{height:270px;background:#132a27;border-radius:18px;color:white;display:flex;align-items:center;justify-content:center;text-align:center;margin:15px 0}.frame{border:3px dashed #70c9aa;padding:45px 30px;border-radius:12px}.pill{padding:6px 9px;border-radius:20px;background:#e1f4ea;color:#116b50;font-size:11px}.success{text-align:center;padding:35px 4px}.success span{display:block;font-size:54px;color:#0b8060}
/* Premium refinement: concise, native-feeling, spacious where it counts */
:root{color-scheme:light;--ink:#142d29;--teal:#075e55;--stroke:#e6ece9;--sub:#677d77;--canvas:#f5f7f5}
body{background:#e7eeea;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;letter-spacing:-.012em}
.app{background:#fcfdfc;padding-left:19px;padding-right:19px}
header{height:68px;border-bottom:1px solid #edf0ed}
.logo{width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(145deg,#086f64,#064b48);font-size:18px;border-radius:13px;box-shadow:0 5px 14px #0e67571b}
.brand b{font-size:14px;letter-spacing:-.025em}.small{color:#899590;font-size:11px}
button{transition:background .17s ease,transform .14s ease;min-height:42px}
button:active{transform:scale(.975)}button:focus-visible{outline:2px solid #50bdaa;outline-offset:3px}
.secondary{background:#f0f4f2;color:#125d53}.outline{border-color:#d9e4de;color:#155e54}
header button{min-height:33px;padding:8px 11px;font-size:11px;border-radius:11px}
h1{font-size:26px;line-height:1.1;letter-spacing:-.055em;margin-top:28px;font-weight:780}
h3{font-size:13px;letter-spacing:-.01em;margin-top:22px;margin-bottom:11px}
.muted{color:#71827c;line-height:1.45}.grid{gap:8px}
.tile{border:1px solid #edf0ec;background:#f6f8f6;padding:15px 14px;border-radius:15px;min-height:90px;color:#46655d;font-size:12px;font-weight:550}
.tile strong{font-size:25px;color:#102e29;font-weight:780;letter-spacing:-.06em;margin-bottom:6px}
.card{background:white;border:1px solid #e8edeb;border-radius:15px;margin:8px 0;padding:15px 14px;box-shadow:0 2px 9px #153b3306}
.card b{font-size:14px;letter-spacing:-.022em}.card .muted{margin-top:5px}
.actions{gap:8px}.actions button{background:#fff;color:#225e55;border:1px solid #e8edeb;border-radius:14px;min-height:72px;padding:10px 1px;box-shadow:0 2px 8px #153b3305;font-size:10px}
.actions b{font-size:21px;font-weight:500;color:#076a60}
.nav{background:#fbfdfc;border-top:1px solid #e9efec;box-shadow:0 -6px 23px #12382b07}
.nav button{min-height:52px;font-size:10px;letter-spacing:.005em}.nav button b{font-size:19px;line-height:1.3}.nav button.on{color:#086b5e;font-weight:750}
.fab{background:linear-gradient(145deg,#08786a,#07594f);width:50px;height:50px;border-radius:16px;bottom:calc(79px + env(safe-area-inset-bottom));box-shadow:0 6px 18px #08645330}
.overlay{background:#0c262176;backdrop-filter:blur(5px)}.panel{border-radius:26px 26px 0 0;padding:23px 21px calc(30px + env(safe-area-inset-bottom));box-shadow:0 -12px 55px #123a3326}
.panel h3{font-size:18px;margin:7px 0 18px;letter-spacing:-.035em}.panel .card{background:#f8faf8}
label{font-size:12px;letter-spacing:.01em}input,select{min-height:47px;border-color:#dfe8e3;background:#fbfcfb}
.camera{background:radial-gradient(ellipse at 50% 30%,#28514b 0%,#102e2a 55%,#071b19 100%);border-radius:21px}.frame{border:2px solid #8dd6bb;padding:38px 25px;border-radius:16px}
.pill{background:#e5f4eb;color:#126448}.success span{font-size:49px}
@media(min-width:600px){.app{min-height:calc(100dvh - 50px);max-width:430px;margin:25px auto;border-radius:28px;box-shadow:0 25px 70px #113e3225;overflow:hidden}.nav{border-radius:0 0 28px 28px}}

/* v3 action-first polished product experience */
h1{margin-top:19px;font-size:27px}h3{margin:18px 0 10px}.card{margin:7px 0;padding:12px 14px}.tile{min-height:72px;padding:11px 13px}.tile strong{font-size:21px}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:#64827a}.priority{border:1px solid #e5ece8;border-radius:15px;padding:13px;margin:9px 0;background:#fff}.priority b{font-size:14px}.priority p{color:#72837d;font-size:12px;margin:6px 0 11px}.priority button{width:100%;background:#ecf5f0;color:#086253;font-size:12px;text-align:left;padding:10px}.priority:first-of-type button{background:#087264;color:#fff}.compactstats{display:flex;gap:7px;margin:16px 0}.compactstats div{background:#f5f8f6;border-radius:11px;flex:1;text-align:center;padding:10px 4px;font-size:10px;color:#71837c}.compactstats b{display:block;font-size:18px;color:#193f35}.customerhero{background:linear-gradient(135deg,#0c423a,#087466);padding:18px;color:white;border-radius:19px;margin:13px 0}.customerhero h1{margin:5px 0;color:white}.customerhero p{color:#d7eee5}.customeractions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.customeractions button{background:#edf6f1;color:#155d50;font-size:10px;min-height:68px;padding:6px 3px}.customeractions b{display:block;font-size:20px;margin-bottom:5px}.steps{display:flex;gap:5px;margin:14px 0}.steps span{flex:1;font-size:10px;text-align:center;padding:9px 4px;background:#f1f5f2;border-radius:8px}.steps .current{background:#d5ede3;color:#095847;font-weight:800}.note{background:#fff5e4;color:#835c22;padding:12px;border-radius:11px;font-size:12px;margin:10px 0}.checkstatus{background:#eaf5ef;color:#1b6a50;border-radius:11px;padding:10px;font-size:12px}.nav{z-index:3}.fab{z-index:4}.overlay{z-index:8}</style></head><body><div class="app"><header><div class="brand"><div class="logo">S</div><div><b>Stark Packmate</b><div class="small" id="role">Field Sales · Preview</div></div></div><button class="secondary" onclick="toggleRole()">Switch role</button></header><main id="main"></main></div><button class="fab" onclick="sheet('actions')">+</button><nav class="nav" id="nav"></nav><div class="overlay hide" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div><script>
let role='Field Sales',page='Home',mode='normal',name='Mehta Foods',family='Stand-Up Pouch',qty='10000',step=0,count=0;const E=id=>document.getElementById(id);const B=(x,fn,c='')=>'<button class="'+c+'" onclick="'+fn+'">'+x+'</button>';const row=(a,b,fn)=>'<div class="card row" onclick="'+fn+'"><div><b>'+a+'</b><div class="muted">'+b+'</div></div><b>›</b></div>';function toggleRole(){role=role==='Field Sales'?'Sales Team':'Field Sales';page='Home';mode='normal';render()}function go(p){page=p;render()}function enterEvent(){mode='event';go('Capture')}function leaveEvent(){mode='normal';go('Home')}function actionRow(){return '<div class="actions">'+[['▤','Quick Quote','quote'],['▦','Share Card','card'],['＋','New Lead','lead'],['▣','Catalog','catalog']].map(x=>B('<b>'+x[0]+'</b>'+x[1],"sheet('"+x[2]+"')")).join('')+'</div>'}
function render(){E('role').textContent=role+' · UX Review';let tabs=mode==='event'?['Home','Capture','Visitors','Quotes','More']:['Home','Leads','Quotes','Tasks','More'];E('nav').innerHTML=tabs.map((t,i)=>B('<b>'+['⌂','♙','▤','✓','⋯'][i]+'</b>'+t,"go('"+t+"')",page===t?'on':'')).join('');let h='';
if(page==='Home')h='<div class="eyebrow">'+(role==='Field Sales'?'FIELD SALES':'SALES WORKSPACE')+'</div><h1>Your day, in focus.</h1><p class="muted">Three customers need your attention.</p><h3>Next best actions</h3><div class="priority"><div class="row"><b>Mehta Foods</b><span class="pill">Today · 11 AM</span></div><p>'+(role==='Field Sales'?'Customer visit · Packaging requirements':'Customer needs pricing · Stand-Up Pouch')+'</p>'+B('▤ &nbsp; Prepare quick quote',"name='Mehta Foods';step=0;sheet('quote')")+'</div><div class="priority"><div class="row"><b>Sharma Foods</b><span class="pill">Due today</span></div><p>Discuss sample and confirm packaging specifications.</p>'+B('↗ &nbsp; Open customer',"customer('Sharma Foods')")+'</div><div class="priority"><div class="row"><b>Gupta Enterprises</b><span class="pill">Upcoming</span></div><p>Share the relevant label catalog.</p>'+B('▣ &nbsp; Select catalog',"name='Gupta Enterprises';sheet('catalog')")+'</div><h3>Quick tools</h3>'+actionRow()+'<div class="compactstats"><div><b>5</b>Follow-ups</div><div><b>2</b>Quotes</div><div><b>4</b>New leads</div></div>'+B('Trade Show Mode ↗','enterEvent()','full secondary')+'<p class="small">Illustrative data. Inbound is restricted to separately authorized users.</p>';
if(page==='Leads')h='<div class="eyebrow">CUSTOMER WORKSPACE</div><h1>My leads</h1><p class="muted">Customers, context and actions in one place.</p>'+['Mehta Foods','Sharma Foods','Gupta Enterprises'].map(n=>row(n,'Open opportunity',"customer('"+n+"')")).join('')+B('＋ New lead',"sheet('lead')",'full secondary');
if(page==='Customer')h=B('‹ My Leads',"go('Leads')",'outline')+'<div class="customerhero"><div class="eyebrow" style="color:#a5d9cb">CUSTOMER</div><h1>'+name+'</h1><p>Stand-Up Pouch · Active opportunity</p></div><h3>Take action</h3><div class="customeractions">'+[['☎','Call','contact'],['◉','WhatsApp','contact'],['▤','Quote','quote'],['✓','Follow-up','followup']].map(x=>B('<b>'+x[0]+'</b>'+x[1],"step=0;sheet('"+x[2]+"')")).join('')+'</div><h3>What matters</h3><div class="card"><b>Current requirement</b><p class="muted">10,000 printed stand-up pouches</p><div class="checkstatus">✓ Customer context ready for Quick Quote</div></div><div class="card"><b>Last interaction</b><p class="muted">Discussed samples and quantity alternatives.</p></div>'+B('Prepare estimate',"step=0;sheet('quote')",'full');
if(page==='Quotes')h='<div class="eyebrow">PRICING WORKSPACE</div><h1>Quotes</h1><p class="muted">Start a quote without losing customer context.</p>'+B('＋ Quick Quote',"step=0;sheet('quote')",'full')+'<h3>Next quote actions</h3>'+['Draft estimates','Awaiting approval','Ready to share'].map(n=>row(n,'Review status',"step=0;sheet('quote')")).join('')+'<p class="note">Prototype only. Real prices, approvals and sending are disabled.</p>';
if(page==='Tasks')h='<div class="eyebrow">FOLLOW-UPS</div><h1>Today</h1><p class="muted">The next action is always one tap away.</p>'+['Call Mehta Foods','Send Sharma quotation','Check Gupta samples'].map(n=>row(n,'Follow-up due',"sheet('followup')")).join('');
if(page==='More')h='<h1>More tools</h1>'+row('Trade Show Mode','Rapid visitor capture','enterEvent()')+row('My digital card','Customer contact exchange',"sheet('card')")+row('Catalog library','Find approved brochures',"sheet('catalog')")+'<p class="muted">Inbound access is assigned separately, not automatically by sales role.</p>';
if(page==='Capture')h='<div class="row"><div><div class="eyebrow">EVENT MODE</div><h1>Next visitor</h1></div>'+B('Exit','leaveEvent()','outline')+'</div><p class="muted">Scan, check details, save, repeat.</p><div class="camera" onclick="sheet(\'scan\')"><div class="frame">▣<h3>Scan business card</h3>Tap to try sample capture</div></div>'+B('Scan Visitor',"sheet('scan')",'full')+B('Enter details',"sheet('review')",'full secondary')+'<div class="compactstats"><div><b>'+count+'</b>Demo captured</div><div><b>0</b>Live synced</div><div><b>0</b>Delivered</div></div>';
if(page==='Visitors')h='<h1>Captured visitors</h1><p class="muted">Demo session only.</p><div class="tile"><strong>'+count+'</strong>Visitors captured</div>'+(count?row('Rahul Sharma','Saved in demo only',"customer('Rahul Sharma')"):'<p class="muted">Nothing captured yet.</p>')+B('Capture next visitor',"go('Capture')",'full');
E('main').innerHTML=h}
function customer(n){name=n;go('Customer')}function closeSheet(){E('overlay').classList.add('hide');render()}function sheet(s){let h='<div class="row"><h3>'+({actions:'Quick actions',quote:'Quick Quote',card:'Share Card',lead:'New Lead',catalog:'Catalogs',scan:'Scan Visitor',review:'Review Visitor',saved:'Visitor Captured',followup:'Follow-up'}[s]||s)+'</h3>'+B('✕','closeSheet()','outline')+'</div>';if(s==='actions')h+=actionRow();if(s==='quote'){h+='<h2>Quick Quote</h2><p class="muted">The existing workbench supports published service families, appropriate sizes and custom dimensions, compatible constructions, printing, permitted add-ons, valid quantity pricing, multiple estimate lines, saved drafts and customer lookup.</p><div class="card"><b>Use the real pricing engine</b><p class="muted">The prototype cannot calculate prices and will not invent amounts. Open authenticated Quick Quote to test the actual workflow.</p></div><div class="note">Formal quote conversion remains subject to existing pricing review and approval rules.</div><a href="/quick-quote" class="btn" style="display:block;text-align:center;text-decoration:none">Open real Quick Quote</a>';}
if(s==='lead')h+=B('Scan card',"sheet('scan')",'full')+B('Manual entry',"sheet('review')",'full secondary');if(s==='card')h+='<div class="card success"><span>▦</span><h3>Digital Business Card</h3><p class="muted">QR and contact sharing mockup; no actual contact shared.</p></div>';if(s==='catalog')h+=['Stand-Up Pouches','3 Side Seal','Labels','Center Seal'].map(x=>row(x,'Sample brochure', "alert('Preview only: no message sent')")).join('');if(s==='scan')h+='<div class="camera"><div class="frame">▣<h3>Sample camera view</h3></div></div>'+B('Capture sample card',"sheet('review')",'full');if(s==='review')h+='<label>Name</label><input id="visitor" value="Rahul Sharma"><label>Company</label><input value="Sharma Foods"><label>Phone</label><input value="+91 98765 43210">'+B('Save visitor',"count++;sheet('saved')",'full');if(s==='saved')h+='<div class="success"><span>✓</span><h2>Visitor Captured</h2><p>CRM sync and WhatsApp queued (demo only)</p></div>'+B('Scan Next Visitor',"closeSheet();go('Capture')",'full')+B('View Visitors',"closeSheet();go('Visitors')",'full secondary');if(s==='followup')h+='<label>Notes</label><input placeholder="Customer follow-up">'+B('Close demo','closeSheet()','full');E('panel').innerHTML=h;E('overlay').classList.remove('hide')}function quoteNext(){closeSheet()}render();
</script></body></html>
