<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>SETU Flow Mobile UX Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e9efed;color:#15312d;font:15px -apple-system,BlinkMacSystemFont,Arial}.app{background:white;max-width:430px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(94px + env(safe-area-inset-bottom))}header{height:65px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4ece9}.logo{background:#076e60;color:white;border-radius:12px;padding:10px;font-weight:bold}.brand{display:flex;align-items:center;gap:9px}.small{font-size:12px;color:#70827e}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#087364;color:white;font-weight:700}.secondary{background:#eaf3f0;color:#0a6e60}.outline{background:#fff;color:#19574e;border:1px solid #d6e3de}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#f1f6f4;border-radius:14px;padding:15px}.tile strong{font-size:23px;display:block}.card{border:1px solid #e3ebe7;border-radius:14px;padding:15px;margin:10px 0}.muted{color:#6d807a;font-size:13px}h1{font-size:23px;margin:23px 0 4px}h3{font-size:15px;margin:22px 0 12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.actions button{background:#f0f5f3;color:#195e54;padding:12px 2px;font-size:11px}.actions b{display:block;font-size:22px;margin-bottom:7px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:white;border-top:1px solid #e4ece9;display:flex;justify-content:space-around;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}.nav button{background:white;color:#5e736e;font-size:11px;padding:6px}.nav button b{display:block;font-size:20px}.nav button.on{color:#087364}.fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - 390px)/2));border-radius:17px;font-size:24px;box-shadow:0 4px 18px #074d4144}.overlay{position:fixed;inset:0;background:#143d3688;display:flex;align-items:end;justify-content:center}.panel{max-width:430px;width:100%;background:white;border-radius:22px 22px 0 0;padding:20px 18px calc(30px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.hide{display:none}label{display:block;font-weight:700;font-size:12px;color:#55716a;margin:15px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d7e5df;border-radius:12px}.full{width:100%;margin-top:12px}.camera{height:270px;background:#132a27;border-radius:18px;color:white;display:flex;align-items:center;justify-content:center;text-align:center;margin:15px 0}.frame{border:3px dashed #70c9aa;padding:45px 30px;border-radius:12px}.pill{padding:6px 9px;border-radius:20px;background:#e1f4ea;color:#116b50;font-size:11px}.success{text-align:center;padding:35px 4px}.success span{display:block;font-size:54px;color:#0b8060}</style></head><body><div class="app"><header><div class="brand"><div class="logo">S</div><div><b>Stark Packmate</b><div class="small" id="role">Field Sales · Preview</div></div></div><button class="secondary" onclick="toggleRole()">Switch role</button></header><main id="main"></main></div><button class="fab" onclick="sheet('actions')">+</button><nav class="nav" id="nav"></nav><div class="overlay hide" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div><script>
let role='Field Sales',page='Home',mode='normal',name='Mehta Foods',family='Stand-Up Pouch',qty='10000',step=0,count=0;const E=id=>document.getElementById(id);const B=(x,fn,c='')=>'<button class="'+c+'" onclick="'+fn+'">'+x+'</button>';const row=(a,b,fn)=>'<div class="card row" onclick="'+fn+'"><div><b>'+a+'</b><div class="muted">'+b+'</div></div><b>›</b></div>';function toggleRole(){role=role==='Field Sales'?'Sales Team':'Field Sales';page='Home';mode='normal';render()}function go(p){page=p;render()}function enterEvent(){mode='event';go('Capture')}function leaveEvent(){mode='normal';go('Home')}function actionRow(){return '<div class="actions">'+[['▤','Quick Quote','quote'],['▦','Share Card','card'],['＋','New Lead','lead'],['▣','Catalog','catalog']].map(x=>B('<b>'+x[0]+'</b>'+x[1],"sheet('"+x[2]+"')")).join('')+'</div>'}
function render(){E('role').textContent=role+' · Preview';let tabs=mode==='event'?['Home','Capture','Visitors','Quotes','More']:['Home','Leads','Quotes','Tasks','More'];E('nav').innerHTML=tabs.map((t,i)=>B('<b>'+['⌂','♙','▤','✓','⋯'][i]+'</b>'+t,"go('"+t+"')",page===t?'on':'')).join('');let h='';if(page==='Home')h='<h1>'+(role==='Field Sales'?'Your day, simplified.':'Your sales workspace.')+'</h1><p class="muted">What should you do next?</p><div class="grid">'+[['5','Follow-ups'],['3','Customer visits'],['2','Quotes pending'],['4','New leads']].map(x=>'<div class="tile"><strong>'+x[0]+'</strong>'+x[1]+'</div>').join('')+'</div><h3>Quick actions</h3>'+actionRow()+'<h3>Next actions</h3>'+row('Mehta Foods','Customer visit · 11 AM',"customer('Mehta Foods')")+row('Sharma Foods','Quick quotation needed',"customer('Sharma Foods')")+row('Gupta Enterprises','Sample follow-up',"customer('Gupta Enterprises')")+B('Enter Trade Show Mode',"enterEvent()",'full secondary')+'<p class="small">Sample data · no backend access</p>';if(page==='Leads')h='<h1>My Leads</h1><p class="muted">Your assigned customers</p>'+['Mehta Foods','Sharma Foods','Gupta Enterprises'].map(n=>row(n,'Open opportunity',"customer('"+n+"')")).join('');if(page==='Customer')h=B('‹ Back',"go('Leads')",'outline')+'<h1>'+name+'</h1><p class="muted">Customer · Stand-Up Pouch</p>'+actionRow()+'<h3>Next action</h3>'+row('Prepare quotation','10,000 pieces',"sheet('quote')")+'<div class="card">Last note: Discuss packaging, samples, and pricing.</div>';if(page==='Quotes')h='<h1>Quotes</h1>'+B('Create Quick Quote',"sheet('quote')",'full')+['Draft estimates','Awaiting approval','Ready to share'].map(n=>row(n,'Demo workflow',"sheet('quote')")).join('');if(page==='Tasks')h='<h1>My Follow-ups</h1>'+['Call Mehta Foods','Send Sharma quotation','Check Gupta sample'].map(n=>row(n,'Today',"sheet('followup')")).join('');if(page==='More')h='<h1>More</h1>'+row('Trade Show Mode','Capture visitors quickly','enterEvent()')+row('My Card','Share contact',"sheet('card')")+row('Catalogs','Approved brochures',"sheet('catalog')");if(page==='Capture')h='<div class="row"><h1>Trade Show</h1>'+B('Exit','leaveEvent()','outline')+'</div><p class="muted">Capture the visitor first; delivery can follow.</p><div class="tile">'+count+' visitors captured (demo)</div><div class="camera" onclick="sheet(\'scan\')"><div class="frame">▣<h3>Scan business card</h3>Tap to test</div></div>'+B('Scan Visitor',"sheet('scan')",'full')+B('Enter manually',"sheet('review')",'full secondary');if(page==='Visitors')h='<h1>Event visitors</h1><div class="tile">'+count+' captured</div>'+(count?row('Rahul Sharma','Saved locally (demo)',"customer('Rahul Sharma')"):'<p class="muted">No visitors captured yet.</p>')+B('Scan visitor',"go('Capture')",'full');E('main').innerHTML=h}
function customer(n){name=n;go('Customer')}function closeSheet(){E('overlay').classList.add('hide');render()}function sheet(s){let h='<div class="row"><h3>'+({actions:'Quick actions',quote:'Quick Quote',card:'Share Card',lead:'New Lead',catalog:'Catalogs',scan:'Scan Visitor',review:'Review Visitor',saved:'Visitor Captured',followup:'Follow-up'}[s]||s)+'</h3>'+B('✕','closeSheet()','outline')+'</div>';if(s==='actions')h+=actionRow();if(s==='quote'){h+='<p class="muted">Step '+(step+1)+' of 3 · Sample quote</p>';if(step===0)h+='<label>Customer</label><input id="customer" value="'+name+'">';if(step===1)h+='<label>Service family</label><select id="family">'+['Stand-Up Pouch','3 Side Seal','Center Seal','Labels','Spout Pouches','Courier Bags'].map(x=>'<option>'+x+'</option>')+'</select><label>Quantity</label><input id="qty" value="'+qty+'">';if(step===2)h+='<div class="card"><b>'+name+'</b><p>'+family+' · '+qty+' pieces</p><p class="muted">Live pricing and customer sharing are disabled in this prototype.</p></div>';h+=B(step===2?'Close demo':'Continue','quoteNext()','full')+(step?B('Previous','step--;sheet(\'quote\')','full outline'):'')}if(s==='lead')h+=B('Scan card',"sheet('scan')",'full')+B('Manual entry',"sheet('review')",'full secondary');if(s==='card')h+='<div class="card success"><span>▦</span><h3>Digital Business Card</h3><p class="muted">QR and contact sharing mockup; no actual contact shared.</p></div>';if(s==='catalog')h+=['Stand-Up Pouches','3 Side Seal','Labels','Center Seal'].map(x=>row(x,'Sample brochure', "alert('Preview only: no message sent')")).join('');if(s==='scan')h+='<div class="camera"><div class="frame">▣<h3>Sample camera view</h3></div></div>'+B('Capture sample card',"sheet('review')",'full');if(s==='review')h+='<label>Name</label><input id="visitor" value="Rahul Sharma"><label>Company</label><input value="Sharma Foods"><label>Phone</label><input value="+91 98765 43210">'+B('Save visitor',"count++;sheet('saved')",'full');if(s==='saved')h+='<div class="success"><span>✓</span><h2>Visitor Captured</h2><p>CRM sync and WhatsApp queued (demo only)</p></div>'+B('Scan Next Visitor',"closeSheet();go('Capture')",'full')+B('View Visitors',"closeSheet();go('Visitors')",'full secondary');if(s==='followup')h+='<label>Notes</label><input placeholder="Customer follow-up">'+B('Close demo','closeSheet()','full');E('panel').innerHTML=h;E('overlay').classList.remove('hide')}function quoteNext(){if(step===0)name=E('customer').value;if(step===1){family=E('family').value;qty=E('qty').value}if(step===2){step=0;closeSheet()}else{step++;sheet('quote')}}render();
</script></body></html>
